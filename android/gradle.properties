# CI runners have 7 GB RAM total; asking gradle for 8 GB got the
# runner OOM-killed mid-build (all later steps silently skipped).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The CI runner's file-watcher daemon crashes builds with
# "Already watching path" - watching is not worth that.
org.gradle.vfs.watch=false
