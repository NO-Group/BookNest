name: booknest
description: BookNest by N.O Group - The Digital Library Ecosystem for Bookworms
publish_to: 'none'
version: 2.8.0+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  go_router: ^17.3.0
  flutter_riverpod: ^2.5.0
  flutter_markdown: ^0.7.4
  flutter_quill: ^11.5.1
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.3.0
  intl: ^0.20.3
  http: ^1.2.0
  url_launcher: ^6.2.4
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_svg: ^2.0.7
  share_plus: ^7.2.2
  flutter_cache_manager: ^3.3.0
  shared_preferences: ^2.2.0
  home_widget: ^0.9.4
  app_links: ^6.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  permission_handler: ^12.0.1
  camera: ^0.12.1
  audioplayers: ^6.8.1
  pdfx: ^2.11.0
  speech_to_text: ^7.4.0
  record: ^7.1.1
  # WhatsApp-style chat storage: encrypted local store + Google Drive backup.
  pointycastle: ^3.9.1
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  # Production push notifications.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dependency_overrides:
  # jni 1.0.1 is retracted and its Android Gradle file is broken
  # ("Could not find method kotlin()"); 1.0.3 fixes the build.
  jni: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/stylus_polished.svg
    - assets/logo/booknest_logo_new_transparent_dark_theme.png
    - assets/dictionary/words.json
