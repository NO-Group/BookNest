name: booknest
description: BookNest by N.O Group - The Digital Library Ecosystem for Bookworms
publish_to: 'none'
version: 2.38.2+70

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  go_router: ^17.3.0
  flutter_riverpod: ^2.5.0
  flutter_markdown: ^0.7.4
  flutter_quill: ^11.5.1
  flutter_math_fork: ^0.7.4
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.3.0
  intl: ^0.20.3
  http: ^1.2.0
  url_launcher: ^6.2.4
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_svg: ^2.0.7
  share_plus: ^7.2.2
  flutter_cache_manager: ^3.3.0
  shared_preferences: ^2.2.0
  home_widget: ^0.9.4
  app_links: ^6.4.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  permission_handler: ^12.0.1
  camera: ^0.12.1
  audioplayers: ^6.8.1
  pdfx: ^2.11.0
  # Document viewer: zip-based formats (docx/xlsx/pptx/odt/epub) and archives.
  archive: ">=3.6.1 <5.0.0"
  # Windows implementation of video_player (Media Foundation): chat videos
  # play in the PC app too.
  video_player_win: ^3.1.0
  speech_to_text: ^7.4.0
  record: ^7.1.1
  # WhatsApp-style chat storage: encrypted local store + Google Drive backup.
  pointycastle: ^3.9.1
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.1
  # Production push notifications.
  flutter_foreground_task: ^11.0.3
  wakelock_plus: ^1.2.8
  flutter_webrtc: ^0.12.4

dependency_overrides:
  # jni 1.0.1 is retracted and its Android Gradle file is broken
  # ("Could not find method kotlin()"); 1.0.3 fixes the build.
  jni: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/stylus_polished.svg
    - assets/logo/booknest_logo_new_transparent_dark_theme.png
    - assets/dictionary/words.json
    - assets/emotes/
    - assets/sounds/call_ring.wav
    - supabase/functions/booknest-api/index.ts
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans_400Regular.ttf
        - asset: assets/fonts/PlusJakartaSans_400Regular_Italic.ttf
          style: italic
        - asset: assets/fonts/PlusJakartaSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans_700Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans_800ExtraBold.ttf
          weight: 800
