name: booknest
description: BookNest by N.O Group - The Digital Library Ecosystem for Bookworms
publish_to: 'none'
version: 1.3.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  go_router: ^17.3.0
  flutter_riverpod: ^2.5.0
  flutter_markdown: ^0.7.4
  cached_network_image: ^3.3.0
  intl: ^0.20.3
  http: ^1.2.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.7
  share_plus: ^7.2.2
  flutter_cache_manager: ^3.3.0
  shared_preferences: ^2.2.0

dependency_overrides:
  # jni 1.0.1 is retracted and its Android Gradle file is broken
  # ("Could not find method kotlin()"); 1.0.3 fixes the build.
  jni: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/stylus_polished.svg
    - assets/logo/booknest_logo_new_transparent_dark_theme.png
    - assets/dictionary/words.json
