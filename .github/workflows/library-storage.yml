name: Library Storage (MongoDB → R2)

# Storage report and, later, the move of book texts out of MongoDB into
# Cloudflare R2. Settings in ops/storage.env (pushing it starts a run).
# Writes ops/db-stats.md (sizes only, no content) and, for MODE=plan|migrate,
# ops/r2-migration.md/.json. LIMIT_BOOKS=N limits a trial migration.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a106c8-booknest
    paths:
      - 'ops/storage.env'
      - '.github/workflows/library-storage.yml'

concurrency:
  group: library-import-token
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Wait for the server, mint the import key
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/library-token.sh
      - name: Settings
        run: |
          grep -E '^(MODE|LIMIT_BOOKS)=' ops/storage.env >> "$GITHUB_ENV" || true
          grep -E '^(MODE|LIMIT_BOOKS)=' ops/storage.env || echo "MODE=stats (default)"
      - name: Book texts → R2 (MODE=plan is read-only; MODE=migrate moves them)
        if: env.MODE == 'plan' || env.MODE == 'migrate'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPORT_DIR: ops
        run: |
          pip install -q boto3
          python3 tools/library/to_r2.py
          cat ops/r2-migration.md >> "$GITHUB_STEP_SUMMARY"
      - name: Storage report
        if: always()
        run: |
          curl -s --max-time 120 -X POST "$FN_URL" -H "Authorization: Bearer $ANON" \
            -H 'Content-Type: application/json' \
            -d "{\"action\":\"admin.dbStats\",\"importToken\":\"$IMPORT_TOKEN\"}" > stats.json
          python3 - <<'PY'
          import json
          d = json.load(open('stats.json')).get('data', {})
          rows = sorted([c for c in d.get('collections', []) if 'storageMB' in c], key=lambda c: -(c['dataMB'] + c['indexMB']))
          out = ['# MongoDB storage', '', '| db | collection | docs | data MB | storage MB | index MB |', '|---|---|---|---|---|---|']
          for c in rows:
              out.append(f"| {c['db']} | {c['collection']} | {c['count']} | {c['dataMB']} | {c['storageMB']} | {c['indexMB']} |")
          tot = sum(c['dataMB'] + c['indexMB'] for c in rows)
          out += ['', f'Total data+index: {tot:.1f} MB', '', '## Chapters', '', '```', json.dumps(d.get('chapters'), indent=1), '```']
          errs = [c for c in d.get('collections', []) if 'error' in c]
          if errs: out += ['', '## Errors', ''] + [f'- {e}' for e in errs]
          open('ops/db-stats.md', 'w').write('\n'.join(out) + '\n')
          print('\n'.join(out))
          PY
          cat ops/db-stats.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish
        if: always()
        run: bash .github/scripts/commit-library-output.sh "Storage report (${{ env.MODE || 'stats' }})" ops/db-stats.md ops/r2-migration.md ops/r2-migration.json
