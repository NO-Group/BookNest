# Daily: delete chat media older than 30 days from Cloudinary (chat folders
# only). Readers keep media on their phones and in their own Google Drive
# backup; text messages are backed up (sealed) in MongoDB.
# Needs secrets CLOUDINARY_API_KEY + CLOUDINARY_API_SECRET; until they exist
# the report says so and nothing is deleted.
name: Chat media sweep (Cloudinary, 30 days)

on:
  schedule:
    - cron: '17 3 * * *' # daily 03:17 UTC (runs from the default branch)
  workflow_dispatch:
  push:
    branches:
      - arena/01a106c8-booknest
    paths:
      - 'tools/ops/chat_media_sweep.py'
      - '.github/workflows/chat-media-sweep.yml'
      - 'ops/sweep.trigger'

permissions:
  contents: write # commits ops/chat-media-sweep.md (counts only)

concurrency:
  group: chat-media-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Sweep
        env:
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
        run: python3 tools/ops/chat_media_sweep.py
      - name: Commit report
        if: always()
        run: |
          set +e
          git config user.name "booknest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add ops/chat-media-sweep.md
          git diff --cached --quiet && exit 0
          git commit -m "Chat media sweep report [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          exit 0
