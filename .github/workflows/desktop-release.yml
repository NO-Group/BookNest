name: Desktop Release

# BookNest for every PC: Windows, macOS and Linux installers, built from
# the same code as the phone app. Run it from the Actions tab ("Run
# workflow") — each OS uploads its own artifact:
#   • Windows → BookNest-windows (unzip, run booknest.exe)
#   • macOS   → BookNest-macos (unzip, drag to Applications; unsigned,
#                so right-click → Open the first time)
#   • Linux   → BookNest-linux (untar, run ./booknest)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure desktop targets
        run: flutter create --platforms=windows --project-name booknest .
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath BookNest-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BookNest-windows
          path: BookNest-windows.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure desktop targets
        run: flutter create --platforms=macos --project-name booknest .
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent booknest.app ../../../../BookNest-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BookNest-macos
          path: BookNest-macos.zip

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure desktop targets
        run: flutter create --platforms=linux --project-name booknest .
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package
        run: |
          tar -czf BookNest-linux.tar.gz -C build/linux/x64/release/bundle .
          mv BookNest-linux.tar.gz ~/BookNest-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: BookNest-linux
          path: ~/BookNest-linux.tar.gz
