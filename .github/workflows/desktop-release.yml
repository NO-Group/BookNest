name: Desktop Release

# BookNest for every PC: Windows, macOS and Linux, built from the same
# code as the phone app, published together on ONE GitHub Release
# ("BookNest <version> for PC"):
#   • Windows → BookNest-Setup.exe (installer — double-click, done)
#               BookNest-windows.zip (portable — unzip, run booknest.exe)
#   • macOS   → BookNest-macos.zip (unzip, drag to Applications; unsigned,
#               so right-click → Open the first time)
#   • Linux   → BookNest-linux.tar.gz (untar, run ./booknest)
#
# Each OS uploads straight to the release (no artifact hop — the 500 MB
# artifact quota and its accounting lag used to eat uploads). The first job
# to finish creates the release; the others attach to it.
# When a build fails, the exact compiler error is pushed to a
# desktop-diag-<os> branch and opened as an issue.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a03a7f-booknest
      - arena/01a106c8-booknest
    paths:
      # The pipeline itself, or a version bump (= a new release).
      - '.github/workflows/desktop-release.yml'
      - 'pubspec.yaml'

permissions:
  contents: write
  issues: write # failed builds open a dated issue with the real error

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        env:
          # Older plugin CMake files pre-date CMake 4's compatibility
          # cutoff — this restores it (recommended by the error itself).
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # permission_handler_windows compiles against the deprecated
          # <experimental/coroutine> header; MSVC 18 hard-errors on it
          # unless silenced (CMake seeds CXX flags from this env var).
          CXXFLAGS: '/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
          # …and git-bash must NOT rewrite that /D flag into a file path.
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
          test -f build/windows/x64/runner/Release/booknest.exe ||
            { echo "booknest.exe was not produced"; exit 1; }

      - name: Bundle the Visual C++ runtime (app-local)
        shell: pwsh
        run: |
          # Flutter apps need the MSVC runtime. Shipping it next to the exe
          # means BookNest starts even on PCs that never installed the
          # "VC++ Redistributable" (Microsoft permits app-local copies).
          $rel = 'build/windows/x64/runner/Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $env:WINDIR "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $rel -Force; "bundled $dll" }
            else { "WARNING: $dll not found on runner" }
          }

      - name: Package (portable zip + installer)
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value)
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/BookNest-windows.zip

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup (ISCC.exe) is not available' }
          $src = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $out = (Resolve-Path 'dist').Path
          & $iscc "/DMyAppVersion=$ver" "/DSourceDir=$src" "/O$out" 'windows/installer/booknest.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pkg.outputs.version }}
        run: bash .github/scripts/publish-pc-release.sh "$VER" dist/BookNest-Setup.exe dist/BookNest-windows.zip

      - name: Commit build diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desktop-diag.sh windows

  macos:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS (unsigned for CI)
        env:
          CODE_SIGNING_ALLOWED: 'NO'
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build.log
      - name: Package
        id: pkg
        run: |
          VER="$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "Packaging $APP"
          # Absolute destination on purpose (a relative path once landed
          # the zip one level short of the workspace root).
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$GITHUB_WORKSPACE/dist/BookNest-macos.zip"
          ls -la "$GITHUB_WORKSPACE/dist"
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pkg.outputs.version }}
        run: bash .github/scripts/publish-pc-release.sh "$VER" dist/BookNest-macos.zip
      - name: Commit build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desktop-diag.sh macos

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee build.log
      - name: Package
        id: pkg
        run: |
          VER="$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          tar -czf dist/BookNest-linux.tar.gz -C build/linux/x64/release/bundle .
          ls -la dist
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pkg.outputs.version }}
        run: bash .github/scripts/publish-pc-release.sh "$VER" dist/BookNest-linux.tar.gz
      - name: Commit build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desktop-diag.sh linux
