name: Desktop Release

# BookNest for every PC: Windows, macOS and Linux, built from the same
# code as the phone app. Each OS uploads its own artifact:
#   • Windows → BookNest-windows (unzip, run booknest.exe)
#   • macOS   → BookNest-macos (unzip, drag to Applications; unsigned,
#                so right-click → Open the first time)
#   • Linux   → BookNest-linux (untar, run ./booknest)
# When a build fails, the exact compiler error is committed into the
# repo (desktop-error-<os>.txt) so it can be read from anywhere — the
# commit rebases over anything that landed while the build ran.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a03a7f-booknest
    paths:
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write
  issues: write # failed builds open a dated issue with the real error

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        env:
          # The Firebase C++ SDK's bundled CMake files pre-date CMake 4's
          # compatibility cutoff — this restores it (recommended by the
          # error itself).
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # permission_handler_windows compiles against the deprecated
          # <experimental/coroutine> header; MSVC 18 hard-errors on it
          # unless silenced (CMake seeds CXX flags from this env var).
          CXXFLAGS: '/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
          # …and git-bash must NOT rewrite that /D flag into a file path.
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        shell: bash
        run: |
          tail -c 3000 build.log > desktop-error-windows.txt 2>/dev/null || echo "build.log missing" > desktop-error-windows.txt
          cp build.log windows-full.log 2>/dev/null || true
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-windows
          git add desktop-error-windows.txt windows-full.log 2>/dev/null || git add desktop-error-windows.txt
          git commit -q -m "windows build diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-windows || git push -f origin desktop-diag-windows || true
          {
            echo "OS: $RUNNER_OS — [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ''
            echo '```'
            cat desktop-error-windows.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Desktop build failed: windows ($(date -u +%H:%M))" \
            --body-file issue-body.md || true
      - name: Package
        if: success()
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BookNest-windows.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BookNest-windows
          path: BookNest-windows.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS (unsigned for CI)
        env:
          CODE_SIGNING_ALLOWED: 'NO'
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build.log
      - name: Package
        if: success()
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "Packaging $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../../../../BookNest-macos.zip
          ls -la ../../../../BookNest-macos.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BookNest-macos
          path: BookNest-macos.zip
      - name: Publish to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="pc-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          NOTES="BookNest for PC — macOS build. Unzip, drag to Applications. Unsigned: right-click → Open the first time."
          gh release create "$TAG" BookNest-macos.zip \
            --target "$GITHUB_SHA" --title "BookNest for PC — $TAG" --notes "$NOTES" \
            2>&1 | tee release.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" != "0" ]; then
            gh release create "$TAG" BookNest-macos.zip \
              --title "BookNest for PC — $TAG" --notes "$NOTES" \
              2>&1 | tee -a release.log
            STATUS=${PIPESTATUS[0]}
          fi
          if [ "$STATUS" != "0" ]; then
            gh release upload "$TAG" BookNest-macos.zip --clobber 2>&1 | tee -a release.log
            STATUS=${PIPESTATUS[0]}
          fi
          if [ "$STATUS" != "0" ]; then
            tail -c 1500 release.log > release-error.txt || echo "release failed" > release-error.txt
            exit 1
          fi

      - name: Commit build diagnostics
        if: failure()
        run: |
          tail -c 3000 build.log > desktop-error-macos.txt 2>/dev/null || echo "build.log missing" > desktop-error-macos.txt
          [ -f release-error.txt ] && cat release-error.txt >> desktop-error-macos.txt || true
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-macos
          git add desktop-error-macos.txt
          git commit -q -m "macos build diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-macos || git push -f origin desktop-diag-macos || true
          {
            echo "OS: $RUNNER_OS — [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ''
            echo '```'
            cat desktop-error-macos.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Desktop build failed: macos ($(date -u +%H:%M))" \
            --body-file issue-body.md || true

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        run: |
          tail -c 3000 build.log > desktop-error-linux.txt 2>/dev/null || echo "build.log missing" > desktop-error-linux.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-linux
          git add desktop-error-linux.txt
          git commit -q -m "linux build diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-linux || git push -f origin desktop-diag-linux || true
          {
            echo "OS: $RUNNER_OS — [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ''
            echo '```'
            cat desktop-error-linux.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Desktop build failed: linux ($(date -u +%H:%M))" \
            --body-file issue-body.md || true
      - name: Package
        if: success()
        run: |
          tar -czf BookNest-linux.tar.gz -C build/linux/x64/release/bundle .
          mv BookNest-linux.tar.gz ~/BookNest-linux.tar.gz
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BookNest-linux
          path: ~/BookNest-linux.tar.gz
