name: Desktop Release

# BookNest for every PC: Windows, macOS and Linux, built from the same
# code as the phone app. Each OS uploads its own artifact:
#   • Windows → BookNest-windows (unzip, run booknest.exe)
#   • macOS   → BookNest-macos (unzip, drag to Applications; unsigned,
#                so right-click → Open the first time)
#   • Linux   → BookNest-linux (untar, run ./booknest)
# When a build fails, the exact compiler error is committed into the
# repo (desktop-error-<os>.txt) so it can be read from anywhere — the
# commit rebases over anything that landed while the build ran.
# v3 of this pipeline builds WITHOUT Firebase entirely (removed from
# the app), which takes its heavy C++ SDK out of the Windows build.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a03a7f-booknest
    paths:
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write
  issues: write # failed builds open a dated issue with the real error
  actions: write # cleanup of old artifacts keeps us under the storage quota

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free artifact storage (quota is 500 MB; keep this run only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | .id' > /tmp/ids.txt || true
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 && n=$((n+1)) || true
          done < /tmp/ids.txt
          echo "cleared $n old artifacts"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        env:
          # The Firebase C++ SDK's bundled CMake files pre-date CMake 4's
          # compatibility cutoff — this restores it (recommended by the
          # error itself).
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # permission_handler_windows compiles against the deprecated
          # <experimental/coroutine> header; MSVC 18 hard-errors on it
          # unless silenced (CMake seeds CXX flags from this env var).
          CXXFLAGS: '/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS'
          # …and git-bash must NOT rewrite that /D flag into a file path.
          MSYS_NO_PATHCONV: '1'
          MSYS2_ARG_CONV_EXCL: '*'
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        shell: bash
        run: |
          tail -c 3000 build.log > desktop-error-windows.txt 2>/dev/null || echo "build.log missing" > desktop-error-windows.txt
          cp build.log windows-full.log 2>/dev/null || true
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-windows
          git add desktop-error-windows.txt windows-full.log 2>/dev/null || git add desktop-error-windows.txt
          git commit -q -m "windows build diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-windows || git push -f origin desktop-diag-windows || true
          {
            echo "OS: $RUNNER_OS — [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ''
            echo '```'
            cat desktop-error-windows.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Desktop build failed: windows ($(date -u +%H:%M))" \
            --body-file issue-body.md || true
      - name: Package
        if: success()
        id: pkg
        shell: pwsh
        run: |-
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BookNest-windows.zip
          Get-Item BookNest-windows.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        if: success()
        id: up
        with:
          name: BookNest-windows
          path: BookNest-windows.zip
      - name: Retry artifact upload once
        if: failure() && steps.pkg.outcome == 'success' && steps.up.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BookNest-windows
          path: BookNest-windows.zip
          overwrite: true
      - name: Commit package/upload diagnostics
        if: failure() && steps.pkg.outcome != 'success'
        shell: bash
        run: |
          { echo "windows package/upload diag $(date -u +%FT%TZ)";
            echo '--- build.log tail ---';
            tail -c 1500 build.log 2>/dev/null;
            echo '--- files ---';
            ls -la BookNest-windows.zip build/windows/x64/runner/Release/ 2>&1 | tail -30; } > desktop-error-windows.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-windows
          git add desktop-error-windows.txt
          git commit -q -m "windows pkg diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-windows || git push -f origin desktop-diag-windows || true

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free artifact storage (quota is 500 MB; keep this run only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | .id' > /tmp/ids.txt || true
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 && n=$((n+1)) || true
          done < /tmp/ids.txt
          echo "cleared $n old artifacts"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS (unsigned for CI)
        shell: bash
        env:
          CODE_SIGNING_ALLOWED: 'NO'
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build.log
      - name: Package
        if: success()
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "Packaging $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../../../../BookNest-macos.zip
          ls -la ../../../../BookNest-macos.zip
      - uses: actions/upload-artifact@v4
        if: success()
        id: up
        with:
          name: BookNest-macos
          path: BookNest-macos.zip
      - name: Publish to GitHub Releases
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: BookNest-macos.zip
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          [ -f "$ZIP" ] || { echo "FATAL: $ZIP missing before publish" >&2; ls -la; exit 1; }
          TAG="pc-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          NOTES="BookNest for PC — macOS build. Unzip, drag to Applications. Unsigned: right-click → Open the first time."
          STATUS=0
          TRY() {
            gh "$@" >> release.log 2>&1
            STATUS=$?
            tail -n 3 release.log
            return $STATUS
          }
          : > release.log
          TRY release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" --title "BookNest for PC — $TAG" --notes "$NOTES" \
          || TRY release create "$TAG" "$ZIP" \
            --title "BookNest for PC — $TAG" --notes "$NOTES" \
          || TRY release upload "$TAG" "$ZIP" --clobber
          if [ "$STATUS" != "0" ]; then
            tail -c 1500 release.log > release-error.txt || echo "release failed" > release-error.txt
            exit 1
          fi

      - name: Commit build diagnostics
        if: failure()
        shell: bash
        run: |
          tail -c 3000 build.log > desktop-error-macos.txt 2>/dev/null || echo "build.log missing" > desktop-error-macos.txt
          [ -f release-error.txt ] && { echo ''; echo '--- release.log tail ---'; cat release-error.txt; } >> desktop-error-macos.txt || true
          [ -f release.log ] && { echo ''; echo '--- full release log ---'; tail -c 2000 release.log; } >> desktop-error-macos.txt || true
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-macos
          git add desktop-error-macos.txt
          git commit -q -m "macos build diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-macos || git push -f origin desktop-diag-macos || true
          {
            echo "OS: $RUNNER_OS — [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ''
            echo '```'
            cat desktop-error-macos.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Desktop build failed: macos ($(date -u +%H:%M))" \
            --body-file issue-body.md || true

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free artifact storage (quota is 500 MB; keep this run only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | .id' > /tmp/ids.txt || true
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 && n=$((n+1)) || true
          done < /tmp/ids.txt
          echo "cleared $n old artifacts"

      - name: Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libpulse-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        run: |
          tail -c 3000 build.log > desktop-error-linux.txt 2>/dev/null || echo "build.log missing" > desktop-error-linux.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-linux
          git add desktop-error-linux.txt
          git commit -q -m "linux build diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-linux || git push -f origin desktop-diag-linux || true
          {
            echo "OS: $RUNNER_OS — [run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo ''
            echo '```'
            cat desktop-error-linux.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "Desktop build failed: linux ($(date -u +%H:%M))" \
            --body-file issue-body.md || true
      - name: Package
        if: success()
        id: pkg
        shell: bash
        run: |
          tar -czf BookNest-linux.tar.gz -C build/linux/x64/release/bundle .
          ls -la BookNest-linux.tar.gz
      - uses: actions/upload-artifact@v4
        if: success()
        id: up
        with:
          name: BookNest-linux
          path: BookNest-linux.tar.gz
      - name: Retry artifact upload once
        if: failure() && steps.pkg.outcome == 'success' && steps.up.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BookNest-linux
          path: BookNest-linux.tar.gz
          overwrite: true
      - name: Commit package/upload diagnostics
        if: failure() && steps.pkg.outcome != 'success'
        shell: bash
        run: |
          { echo "linux package/upload diag $(date -u +%FT%TZ)";
            echo '--- build.log tail ---';
            tail -c 1200 build.log 2>/dev/null;
            echo '--- files ---';
            ls -la BookNest-linux.tar.gz build/linux/x64/release/bundle 2>&1 | tail -15; } > desktop-error-linux.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B desktop-diag-linux
          git add desktop-error-linux.txt
          git commit -q -m "linux pkg diag $(date -u +%FT%TZ)" || true
          git push -q -f origin desktop-diag-linux || git push -f origin desktop-diag-linux || true
