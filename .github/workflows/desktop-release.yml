name: Desktop Release

# BookNest for every PC: Windows, macOS and Linux, built from the same
# code as the phone app. Each OS uploads its own artifact:
#   • Windows → BookNest-windows (unzip, run booknest.exe)
#   • macOS   → BookNest-macos (unzip, drag to Applications; unsigned,
#                so right-click → Open the first time)
#   • Linux   → BookNest-linux (untar, run ./booknest)
# When a build fails, the exact compiler error is committed into the
# repo (desktop-error-<os>.txt) so it can be read from anywhere — the
# commit rebases over anything that landed while the build ran.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a03a7f-booknest
    paths:
      - '.github/workflows/desktop-release.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        shell: bash
        run: |
          tail -c 2500 build.log > desktop-error-windows.txt 2>/dev/null || echo "build.log missing" > desktop-error-windows.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git add desktop-error-windows.txt
          git commit -q -m "Desktop build diagnostics: windows [skip ci]" || true
          git fetch origin "${GITHUB_REF_NAME}" || true
          git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null || true; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
      - name: Package
        if: success()
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BookNest-windows.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BookNest-windows
          path: BookNest-windows.zip

  collect-diagnostics:
    # Runs whenever any build fails: pulls the run's own logs from the
    # API (this works from GitHub's network even when nothing else can
    # read them) and commits the exact compiler errors into the repo.
    needs: [windows, macos, linux]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather the failed builds' logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -sL --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/logs" \
            -o logs.zip || true
          ls -la logs.zip || true
          mkdir -p extracted
          unzip -o -q logs.zip -d extracted || true
          ls extracted | head -40 || true
          {
            for f in extracted/*.txt; do
              [ -e "$f" ] || continue
              case "$f" in
                *uild*) echo "=== $f ===";;
                *) continue;;
              esac
              grep -aiE "error:|FAILURE:|Exception|CMake Error|fatal error|Unable to|feature not available|\.dart:" "$f" | tail -25 || true
            done
          } > desktop-error.txt
          [ -s desktop-error.txt ] || { echo "(no matched errors — file list follows)"; ls extracted; } > desktop-error.txt
      - name: Commit the diagnostics
        run: |
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git add desktop-error.txt
          git commit -q -m "Desktop build diagnostics [skip ci]" || true
          git fetch origin "${GITHUB_REF_NAME}" || true
          git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null || true; }
          git push origin "HEAD:${GITHUB_REF_NAME}" || true

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS (unsigned for CI)
        env:
          CODE_SIGNING_ALLOWED: 'NO'
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        run: |
          tail -c 2500 build.log > desktop-error-macos.txt 2>/dev/null || echo "build.log missing" > desktop-error-macos.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git add desktop-error-macos.txt
          git commit -q -m "Desktop build diagnostics: macos [skip ci]" || true
          git fetch origin "${GITHUB_REF_NAME}" || true
          git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null || true; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
      - name: Package
        if: success()
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          echo "Packaging $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ../../../../BookNest-macos.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BookNest-macos
          path: BookNest-macos.zip

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libpulse-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee build.log
      - name: Commit build diagnostics
        if: failure()
        run: |
          tail -c 2500 build.log > desktop-error-linux.txt 2>/dev/null || echo "build.log missing" > desktop-error-linux.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git add desktop-error-linux.txt
          git commit -q -m "Desktop build diagnostics: linux [skip ci]" || true
          git fetch origin "${GITHUB_REF_NAME}" || true
          git rebase FETCH_HEAD || { git rebase --abort 2>/dev/null || true; }
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
      - name: Package
        if: success()
        run: |
          tar -czf BookNest-linux.tar.gz -C build/linux/x64/release/bundle .
          mv BookNest-linux.tar.gz ~/BookNest-linux.tar.gz
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BookNest-linux
          path: ~/BookNest-linux.tar.gz
