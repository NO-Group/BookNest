name: Android Release APK

# Builds the installable release APK (direct download) and the Google Play
# App Bundle (.aab), checks both against Play's rules (target SDK,
# restricted permissions, 16 KB native-library alignment) and publishes
# them on a GitHub Release. Runs on pushes, or manually from the Actions
# tab ("Run workflow").

on:
  # Manual: Actions tab → Android Release APK → Run workflow (pick branch)
  workflow_dispatch:
  # Automatic: every push to a build branch produces a fresh APK
  push:
    branches:
      - BookNest
      - main
      - arena/01a03a7f-booknest
      - arena/01a106c8-booknest
    # Only app changes build an APK (library/server work does not).
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write
  issues: write
  actions: write # cleanup of old artifacts keeps us under the storage quota

jobs:
  # Knocks on the LIVE deployed edge function and commits its answers
  # into the repo (backend-probe.txt). The deployed server tells us
  # itself which actions it knows — no guessing, no logs needed.
  probe-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe the deployed edge function
        env:
          FN_URL: https://ekgbbbbjwgfixqarlnil.supabase.co/functions/v1/booknest-api
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZ2JiYmJqd2dmaXhxYXJsbmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDAzODEsImV4cCI6MjEwMzI3NjM4MX0.DTTcX2DOxME72qF0fJzcAPJAWPd64LmhYKtT2SOlRy0
        run: |
          probe() {
            local label="$1" body="$2"
            local out
            out=$(curl -s --max-time 20 -X POST "$FN_URL" \
              -H "Authorization: Bearer $ANON" \
              -H "Content-Type: application/json" \
              -d "$body" | head -c 600)
            echo "$label → ${out:-<no answer>}"
          }
          {
            echo "Live probe of the deployed booknest-api — $(date -u +%FT%TZ)"
            echo "(\"Sign in required\" = the action EXISTS on the server;"
            echo " \"Unknown action\" = the deployed file predates it;"
            echo " ping's `server` field shows the deployed file's version)"
            echo ""
            probe "ping              " '{"action":"ping"}'
            probe "admin.users.list  " '{"action":"admin.users.list"}'
            probe "moderation.list   " '{"action":"moderation.list"}'
            probe "moderation.report " '{"action":"moderation.report"}'
            probe "dm.react          " '{"action":"dm.react"}'
            probe "chat.react        " '{"action":"chat.react"}'
            probe "dm.deleteMessage  " '{"action":"dm.deleteMessage"}'
            probe "chat.deleteMessage" '{"action":"chat.deleteMessage"}'
            probe "feed.like         " '{"action":"feed.like"}'
            probe "books.list        " '{"action":"books.list","payload":{"limit":3}}'
            probe "dictionary.search " '{"action":"dictionary.search","payload":{"q":"serendipity","limit":2}}'
          } > backend-probe.txt
          cat backend-probe.txt

      - name: Commit the probe result
        run: |
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git add backend-probe.txt
          git diff --cached --quiet || git commit -q -m "Backend probe: live edge answers [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || true

  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Free artifact storage (quota is 500 MB; keep this run only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | .id' > /tmp/ids.txt || true
          n=0
          while read -r id; do
            [ -n "$id" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null 2>&1 && n=$((n+1)) || true
          done < /tmp/ids.txt
          echo "cleared $n old artifacts"

      # The hosted runner has ~14 GB free; Gradle + the NDK + an APK and an
      # AAB build need more ("No space left on device" broke earlier runs).
      # Drop toolchains this job never uses. The Android SDK stays.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift \
            /usr/local/julia* /opt/az /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter version (for the record)
        run: flutter --version

      # Report-only: the release build below is the hard gate (it fails on
      # any compile error); this surfaces analyzer errors in the job summary.
      - name: Static analysis (report only)
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          status=$?
          {
            echo "## flutter analyze (exit $status)"
            echo '```text'
            grep -E "^\s*error •" analyze.log | head -60 || true
            tail -3 analyze.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^\s*error •" analyze.log | head -60 || true
          tail -3 analyze.log

      # When KEYSTORE_BASE64 + KEYSTORE_PROPERTIES_BASE64 secrets exist they
      # override the in-repo signing files (the publish-grade path — rotate
      # first, then remove the committed keystore). Without them, the
      # committed identity keeps signing, exactly as before.
      - name: Restore signing identity (secrets override)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES_BASE64: ${{ secrets.KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES_BASE64" ]; then
            mkdir -p android/key
            echo "$KEYSTORE_BASE64" | base64 -d > android/key/booknest-release.jks
            echo "$KEYSTORE_PROPERTIES_BASE64" | base64 -d > android/key/booknest-keystore.properties
            echo "Signing with secret-provided identity."
          else
            echo "No signing secrets — using the committed identity."
          fi

      - name: Firebase config for push (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Only a file registered for THIS app id is used: the Google
          # Services plugin fails the build when no client matches.
          APP_ID="$(grep -oE 'applicationId = "[^"]+"' android/app/build.gradle.kts | cut -d'"' -f2)"
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "- push: GOOGLE_SERVICES_JSON secret not set — building without Firebase" | tee -a firebase-android.md
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > "$RUNNER_TEMP/gs.json"
          PKGS="$(jq -r '[.client[]?.client_info.android_client_info.package_name] | join(", ")' "$RUNNER_TEMP/gs.json" 2>/dev/null)"
          PROJ="$(jq -r '.project_info.project_id // "?"' "$RUNNER_TEMP/gs.json" 2>/dev/null)"
          if jq -e --arg p "$APP_ID" '[.client[]?.client_info.android_client_info.package_name] | index($p)' "$RUNNER_TEMP/gs.json" >/dev/null 2>&1; then
            cp "$RUNNER_TEMP/gs.json" android/app/google-services.json
            echo "- push: google-services.json for \`$APP_ID\` (project \`$PROJ\`) ✅" | tee -a firebase-android.md
          else
            echo "- push: ❌ google-services.json (project \`$PROJ\`) has apps [${PKGS:-unreadable}] but not \`$APP_ID\` — building without Firebase. Add an Android app with package $APP_ID in Firebase and re-download the file." | tee -a firebase-android.md
          fi
          rm -f "$RUNNER_TEMP/gs.json"

      - name: Build release APK
        run: |
          set -o pipefail
          # flutter can exit non-zero AFTER "✓ Built" when the gradle
          # daemon crashes on shutdown — judge by the APK, not the code.
          flutter build apk --release 2>&1 | tee build.log || true
          [ -f build/app/outputs/flutter-apk/app-release.apk ] ||
            { echo "APK was not produced — real build failure"; tail -40 build.log; exit 1; }
          echo "APK built: $(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)"

      # Google Play takes an App Bundle. Same signing identity as the APK
      # (with Play App Signing it is the upload key).
      - name: Build Play App Bundle (.aab)
        run: |
          set -o pipefail
          # BN_PLAY: the Play build leaves out the background-link foreground
          # service (Play policy); the direct-download APK keeps it.
          BN_PLAY=true flutter build appbundle --release --dart-define=BN_PLAY=true 2>&1 | tee build-aab.log || true
          [ -f build/app/outputs/bundle/release/app-release.aab ] ||
            { echo "AAB was not produced"; tail -40 build-aab.log; cp build-aab.log build.log; exit 1; }
          echo "AAB built: $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)"

      - name: Google Play readiness check (report only)
        continue-on-error: true
        run: |
          bash .github/scripts/play-check.sh build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab > play-check.md || true
          [ -f firebase-android.md ] && { echo; echo '## Push'; echo; cat firebase-android.md; } >> play-check.md
          cat play-check.md
          cat play-check.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ops && cp play-check.md ops/play-check.md
          case "$GITHUB_REF_NAME" in
            arena/*) bash .github/scripts/commit-library-output.sh "Play readiness report" ops/play-check.md ;;
          esac

      - name: Upload APK artifact
        continue-on-error: true # quota accounting can lag; the Release below is the real channel
        uses: actions/upload-artifact@v4
        with:
          name: BookNest-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          VER="$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')"
          TAG="app-${VER}-${GITHUB_RUN_ID}"
          cp build/app/outputs/flutter-apk/app-release.apk booknest.apk
          cp build/app/outputs/bundle/release/app-release.aab booknest-play.aab
          NOTES="BookNest ${VER} for Android. Download booknest.apk and install it (allow installs from this source when asked). booknest-play.aab is the Google Play upload (Play Console only — phones cannot install it)."
          TRY() {
            gh "$@" 2>&1 | tee -a release-apk.log
            return ${PIPESTATUS[0]}
          }
          : > release-apk.log
          # Release notes = install note + the Google Play readiness report.
          { echo "$NOTES"; echo; [ -f play-check.md ] && sed 's/^# /### /' play-check.md; } > notes.md
          TRY release create "$TAG" booknest.apk booknest-play.aab \
            --target "$GITHUB_SHA" --title "BookNest ${VER} for Android" --notes-file notes.md \
          || TRY release create "$TAG" booknest.apk booknest-play.aab \
            --title "BookNest ${VER} for Android" --notes-file notes.md \
          || TRY release upload "$TAG" booknest.apk booknest-play.aab --clobber
          COUNT="$(gh release view "$TAG" --json assets --jq '[.assets[].name] | length')"
          if [ "${COUNT:-0}" = "0" ]; then
            tail -c 1500 release-apk.log
            exit 1
          fi
          echo "APK live on release $TAG"

      # If the build fails, the last part of the build log is posted as
      # a comment on PR #4 (reachable via the GitHub API even when the
      # raw-log blob host is not) and the full log is uploaded as an
      # artifact ("ci-build-log").
      - name: Publish build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Build error — last 200 lines (run ${GITHUB_RUN_ID})"
            echo '```text'
            tail -n 200 build.log 2>/dev/null | cut -c1-200 || echo "(build.log missing — failure happened before the build step)"
            echo '```'
          } > body.md
          gh issue comment 4 --repo "${{ github.repository }}" \
            --body-file body.md || \
          gh issue create --repo "${{ github.repository }}" \
            --title "CI build diagnostics" --body-file body.md || true
          mkdir -p diag && cp build.log diag/ 2>/dev/null || true
          tail -n 400 build.log > diag/build-error-tail.txt 2>/dev/null || true
          # The blob host that serves run logs is unreachable from some
          # sandboxes — commit the tail straight into the branch (marked
          # [skip ci] so this never loops) where the agent can read it.
          if [ -s diag/build-error-tail.txt ]; then
            git config user.email "booknest-ci@users.noreply.github.com"
            git config user.name "booknest-ci"
            git add diag/build-error-tail.txt
            git commit -q -m "CI build diagnostics for ${GITHUB_SHA} [skip ci]"
            # The probe job may have pushed first — rebase and retry.
            # NEVER force-push this branch: a stale diag commit would
            # rewind newer work (that is how today's branch reset happened).
            git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
            git push -q origin "HEAD:${GITHUB_REF_NAME}" ||
              { git fetch -q origin "${GITHUB_REF_NAME}" &&
                git rebase -q "origin/${GITHUB_REF_NAME}" || true
                git push -q origin "HEAD:${GITHUB_REF_NAME}" ||
                echo "diag push skipped — branch moved again"; }
          fi

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: diag/
          retention-days: 1
          if-no-files-found: ignore
