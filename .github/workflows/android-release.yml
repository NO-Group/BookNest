name: Android Release APK

# Builds the installable release APK and uploads it as a downloadable
# artifact. Runs automatically on pushes, or manually from the Actions
# tab ("Run workflow").

on:
  # Manual: Actions tab → Android Release APK → Run workflow (pick branch)
  workflow_dispatch:
  # Automatic: every push to a build branch produces a fresh APK
  push:
    branches:
      - main
      - arena/01a03a7f-booknest

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter version (for the record)
        run: flutter --version

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookNest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # If the build fails, the last part of the build log is written
      # into the run's summary page, so the cause is always visible at
      # the top of the run (and readable via the checks API) without
      # digging through raw logs.
      - name: Publish build diagnostics
        if: failure()
        run: |
          echo "## Build error — last 200 lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 build.log 2>/dev/null | cut -c1-200 >> "$GITHUB_STEP_SUMMARY" || echo "(build.log missing — failure happened before the build step)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
