name: Android Release APK

# Builds the installable release APK and uploads it as a downloadable
# artifact. Run it from the Actions tab ("Run workflow") or by pushing
# to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookNest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
