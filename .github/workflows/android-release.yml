name: Android Release APK

# Builds the installable release APK and uploads it as a downloadable
# artifact. Runs automatically on pushes, or manually from the Actions
# tab ("Run workflow").

on:
  # Manual: Actions tab → Android Release APK → Run workflow (pick branch)
  workflow_dispatch:
  # Automatic: every push to a build branch produces a fresh APK
  push:
    branches:
      - main
      - arena/01a03a7f-booknest

permissions:
  contents: write
  issues: write

jobs:
  # Knocks on the LIVE deployed edge function and commits its answers
  # into the repo (backend-probe.txt). The deployed server tells us
  # itself which actions it knows — no guessing, no logs needed.
  probe-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe the deployed edge function
        env:
          FN_URL: https://ekgbbbbjwgfixqarlnil.supabase.co/functions/v1/booknest-api
          ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZ2JiYmJqd2dmaXhxYXJsbmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDAzODEsImV4cCI6MjEwMzI3NjM4MX0.DTTcX2DOxME72qF0fJzcAPJAWPd64LmhYKtT2SOlRy0
        run: |
          probe() {
            local label="$1" body="$2"
            local out
            out=$(curl -s --max-time 20 -X POST "$FN_URL" \
              -H "Authorization: Bearer $ANON" \
              -H "Content-Type: application/json" \
              -d "$body" | head -c 600)
            echo "$label → ${out:-<no answer>}"
          }
          {
            echo "Live probe of the deployed booknest-api — $(date -u +%FT%TZ)"
            echo "(\"Sign in required\" = the action EXISTS on the server;"
            echo " \"Unknown action\" = the deployed file predates it;"
            echo " ping's `server` field shows the deployed file's version)"
            echo ""
            probe "ping              " '{"action":"ping"}'
            probe "admin.users.list  " '{"action":"admin.users.list"}'
            probe "moderation.list   " '{"action":"moderation.list"}'
            probe "moderation.report " '{"action":"moderation.report"}'
            probe "dm.react          " '{"action":"dm.react"}'
            probe "chat.react        " '{"action":"chat.react"}'
            probe "dm.deleteMessage  " '{"action":"dm.deleteMessage"}'
            probe "chat.deleteMessage" '{"action":"chat.deleteMessage"}'
            probe "feed.like         " '{"action":"feed.like"}'
            probe "books.list        " '{"action":"books.list","payload":{"limit":3}}'
          } > backend-probe.txt
          cat backend-probe.txt

      - name: Commit the probe result
        run: |
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git add backend-probe.txt
          git diff --cached --quiet || git commit -q -m "Backend probe: live edge answers [skip ci]"
          git push -q origin "HEAD:${GITHUB_REF_NAME}" || true

  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter version (for the record)
        run: flutter --version

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookNest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # If the build fails, the last part of the build log is posted as
      # a comment on PR #4 (reachable via the GitHub API even when the
      # raw-log blob host is not) and the full log is uploaded as an
      # artifact ("ci-build-log").
      - name: Publish build diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Build error — last 200 lines (run ${GITHUB_RUN_ID})"
            echo '```text'
            tail -n 200 build.log 2>/dev/null | cut -c1-200 || echo "(build.log missing — failure happened before the build step)"
            echo '```'
          } > body.md
          gh issue comment 4 --repo "${{ github.repository }}" \
            --body-file body.md || \
          gh issue create --repo "${{ github.repository }}" \
            --title "CI build diagnostics" --body-file body.md || true
          mkdir -p diag && cp build.log diag/ 2>/dev/null || true
          tail -n 400 build.log > diag/build-error-tail.txt 2>/dev/null || true
          # The blob host that serves run logs is unreachable from some
          # sandboxes — commit the tail straight into the branch (marked
          # [skip ci] so this never loops) where the agent can read it.
          if [ -s diag/build-error-tail.txt ]; then
            git config user.email "booknest-ci@users.noreply.github.com"
            git config user.name "booknest-ci"
            git add diag/build-error-tail.txt
            git commit -q -m "CI build diagnostics for ${GITHUB_SHA} [skip ci]"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-log
          path: diag/
          if-no-files-found: ignore
