name: Library to CDN

# The storage fix: MongoDB free tier caps at 512 MB and ~1,600 full
# novels do not fit. BookNest's media law already says it: heavy media
# lives on the CDN, databases hold pointers. This workflow moves every
# stored chapter TEXT to Cloudinary (free), leaving tiny metadata in
# MongoDB — nothing is lost, readers fetch text from the CDN in one
# request. Then it reports exactly how much space was lifted off.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a03a7f-booknest
    paths:
      - '.github/workflows/library-to-cdn.yml'

permissions:
  contents: write

env:
  FN_URL: https://ekgbbbbjwgfixqarlnil.supabase.co/functions/v1/booknest-api
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZ2JiYmJqd2dmaXhxYXJsbmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDAzODEsImV4cCI6MjEwMzI3NjM4MX0.DTTcX2DOxME72qF0fJzcAPJAWPd64LmhYKtT2SOlRy0

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Guard - the access token must exist
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "## Needs SUPABASE_ACCESS_TOKEN (CHECKLIST step 3)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Wake the project (free tier sleeps after a week idle)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          python3 - << 'PYEOF' 2>&1 | tee /tmp/wake.log
          import json, os, sys, time, urllib.request, urllib.error

          REF = 'ekgbbbbjwgfixqarlnil'
          TOK = os.environ['SUPABASE_ACCESS_TOKEN']
          API = 'https://api.supabase.com/v1'

          def api(path, method='GET'):
              req = urllib.request.Request(
                  API + path, data=b'' if method == 'POST' else None,
                  method=method,
                  headers={'Authorization': 'Bearer ' + TOK,
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode()
                      return r.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:300]

          code, info = api('/projects/' + REF)
          print('status read: HTTP %s %r' % (code, info if code != 200
                else info.get('status')), flush=True)
          if code != 200:
              sys.exit(1)
          status = (info.get('status') or '').upper()
          if status.startswith('ACTIVE'):
              print('already awake (' + status + ')')
              sys.exit(0)
          if status == 'RESTORING':
              print('restore already in progress - waiting')
          else:
              code, resp = api('/projects/%s/restore' % REF, 'POST')
              print('restore request: HTTP %s %r' % (code, resp), flush=True)
              if code not in (200, 201):
                  sys.exit(1)
          deadline = time.time() + 25 * 60
          while time.time() < deadline:
              time.sleep(20)
              code, info = api('/projects/' + REF)
              status = ((info.get('status') or '') if code == 200
                        else '').upper()
              print('  ...status: %s' % (status or code), flush=True)
              if status.startswith('ACTIVE'):
                  print('project is awake (' + status + ')')
                  sys.exit(0)
          print('project did not wake in 25 minutes')
          sys.exit(1)
          PYEOF

      - name: Deploy the current server first
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy booknest-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ekgbbbbjwgfixqarlnil
        run: |
          set -o pipefail
          DEPLOY() {
            supabase functions deploy booknest-api \
              --project-ref "$SUPABASE_PROJECT_REF" "$@" 2>&1 | tee /tmp/deploy.log
          }
          # API bundling first; Docker bundling as fallback.
          if DEPLOY --use-api; then
            echo "Deployed (api bundling)."
          elif DEPLOY; then
            echo "Deployed (docker bundling)."
          else
            echo "Deploy failed - the failure diag step will publish the reason."
            exit 1
          fi

      - name: Mint the migration key on the server
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ekgbbbbjwgfixqarlnil
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "IMPORT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          supabase secrets set IMPORT_TOKEN="$TOKEN" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Move every chapter text to the CDN
        env:
          IMPORT_TOKEN: ${{ env.IMPORT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 350
        run: |
          set -o pipefail
          # Resume support: a previous run may have committed the
          # manifest of texts already on the CDN.
          gh release download migration-ledger -p 'manifest.json' -O chapter-manifest.json 2>/dev/null || true
          if [ ! -s chapter-manifest.json ]; then
            git fetch -q origin import-diag 2>/dev/null || true
            git show FETCH_HEAD:chapter-manifest.json > chapter-manifest.json 2>/dev/null || true
          fi
          python3 - << 'PYEOF' 2>&1 | tee migrate.log
          import json, os, sys, time, urllib.request, urllib.error, uuid
          import threading
          from concurrent.futures import ThreadPoolExecutor

          FN_URL = os.environ['FN_URL'].rstrip('/')
          ANON = os.environ['ANON']
          TOKEN = os.environ['IMPORT_TOKEN']
          CLOUD = 'deqdmwlt7'
          PRESET = 'BookNest'

          def call(action, payload, timeout=180):
              body = json.dumps({'action': action,
                                 'importToken': TOKEN,
                                 **payload}).encode()
              req = urllib.request.Request(
                  FN_URL, data=body, method='POST',
                  headers={'Content-Type': 'application/json',
                           'Authorization': 'Bearer ' + ANON})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode()).get('data', {})

          def upload_text(name, text):
              boundary = 'bn' + uuid.uuid4().hex[:16]
              parts = []
              for field, value in (
                      ('upload_preset', PRESET),
                      ('folder', 'booknest/library')):
                  piece = ('--%s\r\nContent-Disposition: form-data; '
                           'name="%s"\r\n\r\n%s\r\n'
                           % (boundary, field, value))
                  parts.append(piece.encode())
              parts.append(
                  ('--%s\r\nContent-Disposition: form-data; '
                   'name="file"; filename="%s"\r\n'
                   'Content-Type: text/plain; charset=utf-8\r\n\r\n'
                   % (boundary, name)).encode()
                  + text.encode('utf-8') + b'\r\n')
              parts.append(('--%s--\r\n' % boundary).encode())
              req = urllib.request.Request(
                  'https://api.cloudinary.com/v1_1/%s/raw/upload' % CLOUD,
                  data=b''.join(parts), method='POST',
                  headers={'Content-Type':
                           'multipart/form-data; boundary=%s' % boundary})
              with urllib.request.urlopen(req, timeout=120) as r:
                  out = json.loads(r.read().decode())
              url = out.get('secure_url')
              if not (isinstance(url, str) and url.startswith('https://')):
                  raise RuntimeError('upload failed for ' + name)
              return url

          # ── phase 1: read-only walk; every text lands on the CDN ──
          # (Over quota MongoDB refuses ALL writes — even deletions —
          # so nothing is written here. The collection is cleared in
          # phase 2, after the manifest is committed.)
          resume = []
          if os.path.exists('chapter-manifest.json'):
              try:
                  resume = json.load(open('chapter-manifest.json',
                                          encoding='utf-8'))
                  print('found a previous manifest: %d chapters already '
                        'on the CDN' % len(resume), flush=True)
              except Exception:
                  resume = []
          done = {(e['bookId'], e['chapterNumber']) for e in resume}
          cursor, shrunk, failures, consecutive = 0, 0, 0, 0
          stats_lock = threading.Lock()

          def handle(job):
              # Runs on a worker thread; returns a manifest entry or None.
              # Transient Atlas TLS hiccups are retried before counting.
              global shrunk, failures, consecutive
              book_id = job['bookId']
              number = int(job['chapterNumber'])
              if (book_id, number) in done:
                  return None
              text = None
              for attempt in range(3):
                  try:
                      text = call('admin.dumpChapter',
                                  {'bookId': book_id,
                                   'chapterNumber': number})
                      break
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode('utf-8', 'replace')[:120]
                      if attempt == 2:
                          with stats_lock:
                              failures += 1
                              consecutive += 1
                          print('  HTTP %d on %s c%d (gave up): %s'
                                % (e.code, book_id, number, detail),
                                flush=True)
                          return None
                      time.sleep(2 + 3 * attempt)
                  except Exception as e:
                      if attempt == 2:
                          with stats_lock:
                              failures += 1
                              consecutive += 1
                          print('  error on %s c%d (gave up): %r'
                                % (book_id, number, e), flush=True)
                          return None
                      time.sleep(2 + 3 * attempt)
              content = (text or {}).get('content') or ''
              if not content:
                  return None
              safe = (book_id + '-c' + str(number))
              safe = safe.replace('/', '_').replace('|', '_')[:120]
              title = (text or {}).get('title') or ''
              try:
                  url = upload_text(safe + '.txt',
                                    title + '\n\n' + content)
              except Exception as e:
                  with stats_lock:
                      failures += 1
                      consecutive += 1
                  print('  upload failed on %s c%d: %r'
                        % (book_id, number, e), flush=True)
                  return None
              with stats_lock:
                  consecutive = 0
              entry = {'bookId': book_id,
                       'chapterNumber': number,
                       'title': title,
                       'url': url,
                       'bytes': len(content)}
              try:
                  call('admin.setChapterUrl',
                       {'bookId': book_id,
                        'chapterNumber': number,
                        'url': url,
                        'bytes': len(content)})
                  shrunk += 1
              except urllib.error.HTTPError:
                  # Over quota: the row stays for now; the whole
                  # collection is dropped after this walk.
                  pass
              except Exception:
                  pass
              return entry

          pool = ThreadPoolExecutor(max_workers=4)
          manifest = list(resume)
          while consecutive <= 60:
              jobs = call('admin.migrateChapterJobs',
                          {'limit': 40, 'skip': cursor})
              batch = jobs.get('jobs') or []
              if not batch:
                  break
              cursor += len(batch)
              fresh = [e for e in pool.map(handle, batch) if e]
              if fresh:
                  manifest.extend(fresh)
                  json.dump(manifest, open('manifest.json', 'w'))
              if len(manifest) % 80 < 8:
                  print('  uploaded %d chapter texts so far'
                        % len(manifest), flush=True)
          pool.shutdown(wait=True)
          if consecutive > 60:
              print('too many consecutive failures - stopping; the '
                    'manifest so far is committed, rerun to resume')
              sys.exit(1)
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f)
          print('phase 1 done: %d texts on the CDN (%d shrunk in place, '
                '%d failures)' % (len(manifest), shrunk, failures),
                flush=True)
          if failures > 0 and len(manifest) == 0:
              sys.exit(1)

          # ── phase 2: clear the bulky collection, then re-seed stubs ──
          # Everything in it is now on the CDN and in the manifest.
          if not manifest and resume:
              manifest = resume
              print('resuming from the committed manifest', flush=True)
          dropped_ok = False
          if manifest:
              try:
                  call('admin.dropChaptersCollection', {})
                  dropped_ok = True
                  print('bulky chapter collection cleared', flush=True)
              except Exception as e:
                  print('collection drop refused by MongoDB: %r' % e,
                        flush=True)
          if manifest and not dropped_ok:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Library to CDN\nAll %d chapter texts are '
                          'safe on the CDN and the manifest is committed.'
                          '\nMongoDB refuses every write while over '
                          'quota, so one click is needed to finish: '
                          'the chapters collection must be cleared in '
                          'the Atlas dashboard, then this workflow is '
                          'simply run again.\n' % len(manifest))
              sys.exit(1)

          if not manifest:
              print('nothing to migrate - the library is already '
                    'CDN-hosted', flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Library to CDN\nNothing to migrate - '
                          'all chapter texts are already on the CDN.\n')
              sys.exit(0)

          pending = list(manifest)
          deadline = time.time() + 45 * 60
          stub_tries = [0]

          def seed(m):
              try:
                  call('admin.restoreChapterStub',
                       {'bookId': m['bookId'],
                        'chapterNumber': m['chapterNumber'],
                        'title': m['title'],
                        'url': m['url'],
                        'bytes': m['bytes']})
                  return None
              except Exception:
                  with stats_lock:
                      stub_tries[0] += 1
                  time.sleep(0.5)
                  return m

          pool2 = ThreadPoolExecutor(max_workers=8)
          while pending and time.time() < deadline:
              results = [r for r in pool2.map(seed, pending)]
              still = [m for m in results if m is not None]
              if len(still) == len(pending) and pending:
                  print('  writes still blocked - waiting a minute '
                        '(%d stubs pending)' % len(still), flush=True)
                  time.sleep(60)
              pending = still
          pool2.shutdown(wait=True)
          if pending:
              with open('stub-backlog.json', 'w') as f:
                  json.dump(pending, f)
              print('%d stubs could not be re-seeded yet - rerun this '
                    'workflow; it resumes from the committed manifest'
                    % len(pending))
              sys.exit(1)
          line = ('DONE: %d chapter texts live on the CDN, '
                  '%.1f MB lifted off MongoDB, %d failures'
                  % (len(manifest), sum(m['bytes'] for m in manifest)
                     / 1048576.0, failures))
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Library to CDN\n' + line + '\n')
          PYEOF

      - name: Save the manifest + logs to the release ledger (no quota, no races)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh release create DELETES the release when its first asset
          # upload hiccups, so create empty first, upload with retries.
          gh release view migration-ledger >/dev/null 2>&1 || \
            gh release create migration-ledger \
              --target "$GITHUB_SHA" --title "Library migration ledger" \
              --notes "Recovery ledger: chapter manifest + migration logs." || true
          if [ -f migrate.log ]; then
            tail -c 200000 migrate.log > migrate-log.txt
            for i in 1 2 3 4 5 6; do
              gh release upload migration-ledger migrate-log.txt --clobber && break
              echo "log upload attempt $i failed"; sleep 15
            done
          fi
          if [ -f manifest.json ]; then
            echo "chapters in manifest: $(python3 -c "import json;print(len(json.load(open('manifest.json'))))")"
            for i in 1 2 3 4 5 6; do
              gh release upload migration-ledger manifest.json --clobber && break
              echo "manifest upload attempt $i failed"; sleep 15
            done
          else
            echo "no manifest this run — the walk uploaded nothing new"
          fi
          gh release view migration-ledger --json assets --jq '.assets[].name' || true

      - name: Mirror the manifest to the import-diag branch
        if: always()
        run: |
          [ -f manifest.json ] || exit 0
          cp manifest.json chapter-manifest.json
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B import-diag
          git add chapter-manifest.json
          git commit -q -m "chapter manifest: $(date -u +%FT%TZ) ($(python3 -c "import json;print(len(json.load(open('chapter-manifest.json'))))" 2>/dev/null || echo '?') chapters)" || true
          echo "pushing manifest to import-diag..."
          git push -f origin import-diag > /tmp/push.log 2>&1
          echo "push exit code: $?" 
          tail -2 /tmp/push.log || true

      - name: Keep the migration manifest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest
          path: manifest.json
          if-no-files-found: ignore

      - name: Verify a chapter reads back from the CDN
        env:
          IMPORT_TOKEN: ${{ env.IMPORT_TOKEN }}
        run: |
          python3 - << 'VEREOF'
          import json, os, urllib.request
          FN_URL = os.environ['FN_URL'].rstrip('/')
          ANON = os.environ['ANON']
          body = json.dumps({'action': 'books.list',
                             'payload': {'limit': 1}}).encode()
          req = urllib.request.Request(
              FN_URL, data=body, method='POST',
              headers={'Content-Type': 'application/json',
                       'Authorization': 'Bearer ' + ANON})
          with urllib.request.urlopen(req, timeout=60) as r:
              out = json.loads(r.read().decode())
          books = out.get('data', {}).get('books') or []
          if not books:
              print('shelf is empty - nothing to verify')
              sys.exit(0)
          book = books[0]
          body = json.dumps({'action': 'books.chapter',
                             'payload': {'bookId': book['id'],
                                         'chapterNumber': 1}}).encode()
          req = urllib.request.Request(
              FN_URL, data=body, method='POST',
              headers={'Content-Type': 'application/json',
                       'Authorization': 'Bearer ' + ANON})
          with urllib.request.urlopen(req, timeout=60) as r:
              ch = json.loads(r.read().decode()).get('data', {})
          url = ch.get('contentUrl')
          if url:
              with urllib.request.urlopen(url, timeout=60) as t:
                  text = t.read().decode('utf-8', 'replace')
              print('VERIFY OK: chapter 1 of "%s" reads from the CDN '
                    '(%d chars)' % (book.get('title'), len(text)))
          elif (ch.get('content') or ''):
              print('chapter still inline (migration will catch it) - fine')
          else:
              print('no content and no url yet - will verify on rerun')
          VEREOF

      - name: Seed the dictionary (WordNet 3.1 — the full Word Nest)
        # Runs only when the library is safely on the CDN and MongoDB
        # is back under its size cap, so the writes land.
        timeout-minutes: 90
        run: |
          set -e
          set -o pipefail
          mkdir -p /tmp/wn && cd /tmp/wn
          npm i --silent wordnet-db >/dev/null 2>&1
          cat > parse.py << 'PARSEEOF'
          """WordNet 3.1 → BookNest dictionary entries.

          Reads the classic WordNet database files and emits one entry per
          word as JSON lines: {"word": ..., "definitions": [...],
          "synonyms": [...], "examples": [...]}.
          """
          import json, os, re, sys

          DICT = sys.argv[1]
          OUT = sys.argv[2]

          POS_FILES = [('noun', 'data.noun'), ('verb', 'data.verb'),
                       ('adj', 'data.adj'), ('adv', 'data.adv')]

          # index.noun: lemma pos synset_cnt ... offsets...
          words = {}
          for pos, _ in POS_FILES:
              idx_path = os.path.join(DICT, 'index.' + pos)
              if not os.path.exists(idx_path):
                  continue
              for line in open(idx_path, encoding='utf-8', errors='replace'):
                  if line.startswith(' '):
                      continue
                  parts = line.split()
                  if len(parts) < 9 or not parts[0][0].isalnum():
                      continue
                  lemma = parts[0].replace('_', ' ')
                  offsets = parts[parts.index(pos) + 1:] if pos in parts else []
                  words.setdefault(lemma, {}).setdefault(pos, []).extend(offsets)

          def clean(g):
              g = re.sub(r'\s*\([^)]*\)\s*', ' ', g)
              return re.sub(r'\s+', ' ', g).strip('; ').strip()

          entries = []
          for lemma, by_pos in words.items():
              definitions, examples, syns = [], [], []
              for pos, offsets in by_pos.items():
                  data_path = os.path.join(DICT, 'data.' + pos)
                  wanted = set(offsets)
                  for line in open(data_path, encoding='utf-8',
                                   errors='replace'):
                      if not line or line[0] == ' ':
                          continue
                      parts = line.split('| ', 1)
                      head = parts[0].split()
                      if not head or head[0] not in wanted:
                          continue
                      gloss = parts[1] if len(parts) > 1 else ''
                      for piece in gloss.split(';'):
                          piece = piece.strip()
                          if piece.startswith('"') and piece.endswith('"'):
                              examples.append(piece.strip('"'))
                          elif piece:
                              d = clean(piece)
                              if d:
                                  definitions.append(d)
                      # synonym pointers follow the gloss's tail; grab |-less
                      for tok in head:
                          if tok.startswith('!'):
                              continue
                      if len(definitions) >= 4:
                          wanted.discard(head[0])
                      if len(definitions) >= 6:
                          break
              if definitions:
                  entries.append({'word': lemma,
                                  'definitions': definitions[:6],
                                  'examples': examples[:3],
                                  'synonyms': sorted(set(syns))[:8]})
          with open(OUT, 'w', encoding='utf-8') as f:
              for e in entries:
                  f.write(json.dumps(e, ensure_ascii=False) + '\n')
          print(f'parsed {len(entries)} dictionary entries')

          PARSEEOF
          python3 parse.py "$PWD/node_modules/wordnet-db/dict" entries.jsonl
          python3 - << 'POSEOF' 2>&1 | tee dictionary-seed.log
          import json, os, sys, time, urllib.request

          FN_URL = os.environ['FN_URL'].rstrip('/')
          ANON = os.environ['ANON']
          TOKEN = os.environ['IMPORT_TOKEN']

          entries = [json.loads(l) for l in open('entries.jsonl', encoding='utf-8')]
          print(f'Dictionary entries parsed: {len(entries)}')

          def post(words):
              body = json.dumps({'action': 'dictionary.import',
                                  'importToken': TOKEN, 'words': words}).encode()
              last = None
              for attempt in range(5):
                  req = urllib.request.Request(
                      FN_URL, data=body, method='POST',
                      headers={'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + ANON})
                  try:
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return json.loads(r.read().decode()).get('data', {})
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode('utf-8', 'replace')[:200]
                      last = f'HTTP {e.code}: {detail}'
                      print(f'  batch attempt {attempt + 1}: {last}', flush=True)
                      if e.code in (401, 403):
                          raise RuntimeError(last)
                  except Exception as e:
                      last = repr(e)
                      print(f'  batch attempt {attempt + 1}: {last}', flush=True)
                  time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'batch failed after 5 tries — {last}')

          total, done = 0, 0
          for i in range(0, len(entries), 200):
              chunk = entries[i:i + 200]
              res = post(chunk)
              total += int(res.get('imported') or 0)
              done += len(chunk)
              if done % 5000 < 200:
                  print(f'  {done}/{len(entries)} words…', flush=True)
          time.sleep(1)
          try:
              body = json.dumps({'action': 'dictionary.search', 'q': 'serendipity'}).encode()
              req = urllib.request.Request(
                  FN_URL, data=body, method='POST',
                  headers={'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + ANON})
              with urllib.request.urlopen(req, timeout=30) as r:
                  found = len(json.loads(r.read().decode()).get('data', {}).get('entries') or [])
              print(f'server lookup check: {found} result(s) for "serendipity"')
          except Exception as e:
              print(f'lookup check skipped ({e})')
          line = f'DONE: dictionary entries stored {total} of {len(entries)}'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Word Nest\\n' + line + '\\n')
          if total == 0:
              sys.exit(1)
          POSEOF

      - name: Commit diagnostics on failure
        if: failure()
        run: |
          { echo "migration diag $(date -u +%FT%TZ)";
            tail -c 2000 /tmp/wake.log 2>/dev/null;
            tail -c 2500 /tmp/deploy.log 2>/dev/null;
            tail -c 2500 migrate.log 2>/dev/null; } > import-error.txt || true
          [ -s import-error.txt ] || echo "no log" > import-error.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B import-diag
          git add import-error.txt
          git commit -q -m "migration diag $(date -u +%FT%TZ)" || true
          git push -q -f origin import-diag || git push -f origin import-diag || true

