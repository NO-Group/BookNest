name: Library to CDN

# The storage fix: MongoDB free tier caps at 512 MB and ~1,600 full
# novels do not fit. BookNest's media law already says it: heavy media
# lives on the CDN, databases hold pointers. This workflow moves every
# stored chapter TEXT to Cloudinary (free), leaving tiny metadata in
# MongoDB — nothing is lost, readers fetch text from the CDN in one
# request. Then it reports exactly how much space was lifted off.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a03a7f-booknest
    paths:
      - '.github/workflows/library-to-cdn.yml'

permissions:
  contents: write

env:
  FN_URL: https://ekgbbbbjwgfixqarlnil.supabase.co/functions/v1/booknest-api
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZ2JiYmJqd2dmaXhxYXJsbmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDAzODEsImV4cCI6MjEwMzI3NjM4MX0.DTTcX2DOxME72qF0fJzcAPJAWPd64LmhYKtT2SOlRy0

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Guard - the access token must exist
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "## Needs SUPABASE_ACCESS_TOKEN (CHECKLIST step 3)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Wake the project (free tier sleeps after a week idle)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        timeout-minutes: 30
        run: |
          set -o pipefail
          python3 - << 'PYEOF' 2>&1 | tee /tmp/wake.log
          import json, os, sys, time, urllib.request, urllib.error

          REF = 'ekgbbbbjwgfixqarlnil'
          TOK = os.environ['SUPABASE_ACCESS_TOKEN']
          API = 'https://api.supabase.com/v1'

          def api(path, method='GET'):
              req = urllib.request.Request(
                  API + path, data=b'' if method == 'POST' else None,
                  method=method,
                  headers={'Authorization': 'Bearer ' + TOK,
                           'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode()
                      return r.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:300]

          code, info = api('/projects/' + REF)
          print('status read: HTTP %s %r' % (code, info if code != 200
                else info.get('status')), flush=True)
          if code != 200:
              sys.exit(1)
          status = (info.get('status') or '').upper()
          if status.startswith('ACTIVE'):
              print('already awake (' + status + ')')
              sys.exit(0)
          if status == 'RESTORING':
              print('restore already in progress - waiting')
          else:
              code, resp = api('/projects/%s/restore' % REF, 'POST')
              print('restore request: HTTP %s %r' % (code, resp), flush=True)
              if code not in (200, 201):
                  sys.exit(1)
          deadline = time.time() + 25 * 60
          while time.time() < deadline:
              time.sleep(20)
              code, info = api('/projects/' + REF)
              status = ((info.get('status') or '') if code == 200
                        else '').upper()
              print('  ...status: %s' % (status or code), flush=True)
              if status.startswith('ACTIVE'):
                  print('project is awake (' + status + ')')
                  sys.exit(0)
          print('project did not wake in 25 minutes')
          sys.exit(1)
          PYEOF

      - name: Deploy the current server first
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy booknest-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ekgbbbbjwgfixqarlnil
        run: |
          set -o pipefail
          DEPLOY() {
            supabase functions deploy booknest-api \
              --project-ref "$SUPABASE_PROJECT_REF" "$@" 2>&1 | tee /tmp/deploy.log
          }
          # API bundling first; Docker bundling as fallback.
          if DEPLOY --use-api; then
            echo "Deployed (api bundling)."
          elif DEPLOY; then
            echo "Deployed (docker bundling)."
          else
            echo "Deploy failed - the failure diag step will publish the reason."
            exit 1
          fi

      - name: Mint the migration key on the server
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ekgbbbbjwgfixqarlnil
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "IMPORT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          supabase secrets set IMPORT_TOKEN="$TOKEN" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Move every chapter text to the CDN
        env:
          IMPORT_TOKEN: ${{ env.IMPORT_TOKEN }}
        timeout-minutes: 240
        run: |
          set -o pipefail
          # Resume support: a previous run may have committed the
          # manifest of texts already on the CDN.
          git fetch -q origin import-diag 2>/dev/null || true
          git show FETCH_HEAD:chapter-manifest.json > chapter-manifest.json 2>/dev/null || true
          python3 - << 'PYEOF' 2>&1 | tee migrate.log
          import json, os, sys, time, urllib.request, urllib.error, uuid

          FN_URL = os.environ['FN_URL'].rstrip('/')
          ANON = os.environ['ANON']
          TOKEN = os.environ['IMPORT_TOKEN']
          CLOUD = 'deqdmwlt7'
          PRESET = 'BookNest'

          def call(action, payload, timeout=180):
              body = json.dumps({'action': action,
                                 'importToken': TOKEN,
                                 **payload}).encode()
              req = urllib.request.Request(
                  FN_URL, data=body, method='POST',
                  headers={'Content-Type': 'application/json',
                           'Authorization': 'Bearer ' + ANON})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode()).get('data', {})

          def upload_text(name, text):
              boundary = 'bn' + uuid.uuid4().hex[:16]
              parts = []
              for field, value in (
                      ('upload_preset', PRESET),
                      ('folder', 'booknest/library')):
                  parts.append(
                      '--%s\r\nContent-Disposition: form-data; '
                      'name="%s"\r\n\r\n%s\r\n' % (boundary, field, value)
                      .encode())
              parts.append(
                  ('--%s\r\nContent-Disposition: form-data; '
                   'name="file"; filename="%s"\r\n'
                   'Content-Type: text/plain; charset=utf-8\r\n\r\n'
                   % (boundary, name)).encode()
                  + text.encode('utf-8') + b'\r\n')
              parts.append(('--%s--\r\n' % boundary).encode())
              req = urllib.request.Request(
                  'https://api.cloudinary.com/v1_1/%s/raw/upload' % CLOUD,
                  data=b''.join(parts), method='POST',
                  headers={'Content-Type':
                           'multipart/form-data; boundary=%s' % boundary})
              with urllib.request.urlopen(req, timeout=120) as r:
                  out = json.loads(r.read().decode())
              url = out.get('secure_url')
              if not (isinstance(url, str) and url.startswith('https://')):
                  raise RuntimeError('upload failed for ' + name)
              return url

          # ── phase 1: read-only walk; every text lands on the CDN ──
          # (Over quota MongoDB refuses ALL writes — even deletions —
          # so nothing is written here. The collection is cleared in
          # phase 2, after the manifest is committed.)
          resume = []
          if os.path.exists('chapter-manifest.json'):
              try:
                  resume = json.load(open('chapter-manifest.json',
                                          encoding='utf-8'))
                  print('found a previous manifest: %d chapters already '
                        'on the CDN' % len(resume), flush=True)
              except Exception:
                  resume = []
          cursor, shrunk, failures = 0, 0, 0
          manifest = []
          while True:
              jobs = call('admin.migrateChapterJobs',
                          {'limit': 40, 'skip': cursor})
              batch = jobs.get('jobs') or []
              if not batch:
                  break
              for job in batch:
                  cursor += 1
                  book_id = job['bookId']
                  number = int(job['chapterNumber'])
                  try:
                      text = call('admin.dumpChapter',
                                  {'bookId': book_id,
                                   'chapterNumber': number})
                      content = text.get('content') or ''
                      if not content:
                          continue
                      safe = (book_id + '-c' + str(number))
                      safe = safe.replace('/', '_').replace('|', '_')[:120]
                      title = text.get('title') or ''
                      url = upload_text(safe + '.txt',
                                        title + '\n\n' + content)
                      entry = {'bookId': book_id,
                               'chapterNumber': number,
                               'title': title,
                               'url': url,
                               'bytes': len(content)}
                      try:
                          call('admin.setChapterUrl',
                               {'bookId': book_id,
                                'chapterNumber': number,
                                'url': url,
                                'bytes': len(content)})
                          shrunk += 1
                      except urllib.error.HTTPError:
                          # Over quota: the row stays for now; the whole
                          # collection is dropped after this walk.
                          pass
                      manifest.append(entry)
                      if len(manifest) % 50 == 0:
                          print('  uploaded %d chapter texts so far'
                                % len(manifest), flush=True)
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode('utf-8', 'replace')[:160]
                      failures += 1
                      print('  HTTP %d on %s c%d: %s'
                            % (e.code, book_id, number, detail), flush=True)
                      if failures > 40:
                          print('too many failures - stopping')
                          sys.exit(1)
                  except Exception as e:
                      failures += 1
                      print('  error on %s c%d: %r'
                            % (book_id, number, e), flush=True)
                      if failures > 40:
                          sys.exit(1)
                  time.sleep(0.15)
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f)
          print('phase 1 done: %d texts on the CDN (%d shrunk in place, '
                '%d failures)' % (len(manifest), shrunk, failures),
                flush=True)
          if failures > 0 and len(manifest) == 0:
              sys.exit(1)

          # ── phase 2: clear the bulky collection, then re-seed stubs ──
          # Everything in it is now on the CDN and in the manifest.
          if not manifest and resume:
              manifest = resume
              print('resuming from the committed manifest', flush=True)
          dropped_ok = False
          if manifest:
              try:
                  call('admin.dropChaptersCollection', {})
                  dropped_ok = True
                  print('bulky chapter collection cleared', flush=True)
              except Exception as e:
                  print('collection drop refused by MongoDB: %r' % e,
                        flush=True)
          if manifest and not dropped_ok:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Library to CDN\nAll %d chapter texts are '
                          'safe on the CDN and the manifest is committed.'
                          '\nMongoDB refuses every write while over '
                          'quota, so one click is needed to finish: '
                          'the chapters collection must be cleared in '
                          'the Atlas dashboard, then this workflow is '
                          'simply run again.\n' % len(manifest))
              sys.exit(1)

          if not manifest:
              print('nothing to migrate - the library is already '
                    'CDN-hosted', flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('### Library to CDN\nNothing to migrate - '
                          'all chapter texts are already on the CDN.\n')
              sys.exit(0)

          pending = list(manifest)
          deadline = time.time() + 45 * 60
          while pending and time.time() < deadline:
              still = []
              for m in pending:
                  try:
                      call('admin.restoreChapterStub',
                           {'bookId': m['bookId'],
                            'chapterNumber': m['chapterNumber'],
                            'title': m['title'],
                            'url': m['url'],
                            'bytes': m['bytes']})
                  except Exception:
                      still.append(m)
                      time.sleep(1)
              if len(still) == len(pending):
                  print('  writes still blocked - waiting a minute '
                        '(%d stubs pending)' % len(still), flush=True)
                  time.sleep(60)
              pending = still
          if pending:
              with open('stub-backlog.json', 'w') as f:
                  json.dump(pending, f)
              print('%d stubs could not be re-seeded yet - rerun this '
                    'workflow; it resumes from the committed manifest'
                    % len(pending))
              sys.exit(1)
          line = ('DONE: %d chapter texts live on the CDN, '
                  '%.1f MB lifted off MongoDB, %d failures'
                  % (len(manifest), sum(m['bytes'] for m in manifest)
                     / 1048576.0, failures))
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Library to CDN\n' + line + '\n')
          PYEOF

      - name: Commit the manifest (recovery ledger)
        if: always()
        run: |
          [ -f manifest.json ] || { echo "no manifest this run"; exit 0; }
          cp manifest.json chapter-manifest.json
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B import-diag
          git add chapter-manifest.json
          git commit -q -m "chapter manifest: $(date -u +%FT%TZ) ($(python3 -c "import json;print(len(json.load(open('chapter-manifest.json'))))" 2>/dev/null || echo '?') chapters)" || true
          git push -q -f origin import-diag || git push -f origin import-diag || true

      - name: Keep the migration manifest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest
          path: manifest.json
          if-no-files-found: ignore

      - name: Verify a chapter reads back from the CDN
        env:
          IMPORT_TOKEN: ${{ env.IMPORT_TOKEN }}
        run: |
          python3 - << 'VEREOF'
          import json, os, urllib.request
          FN_URL = os.environ['FN_URL'].rstrip('/')
          ANON = os.environ['ANON']
          body = json.dumps({'action': 'books.list',
                             'payload': {'limit': 1}}).encode()
          req = urllib.request.Request(
              FN_URL, data=body, method='POST',
              headers={'Content-Type': 'application/json',
                       'Authorization': 'Bearer ' + ANON})
          with urllib.request.urlopen(req, timeout=60) as r:
              out = json.loads(r.read().decode())
          books = out.get('data', {}).get('books') or []
          if not books:
              print('shelf is empty - nothing to verify')
              sys.exit(0)
          book = books[0]
          body = json.dumps({'action': 'books.chapter',
                             'payload': {'bookId': book['id'],
                                         'chapterNumber': 1}}).encode()
          req = urllib.request.Request(
              FN_URL, data=body, method='POST',
              headers={'Content-Type': 'application/json',
                       'Authorization': 'Bearer ' + ANON})
          with urllib.request.urlopen(req, timeout=60) as r:
              ch = json.loads(r.read().decode()).get('data', {})
          url = ch.get('contentUrl')
          if url:
              with urllib.request.urlopen(url, timeout=60) as t:
                  text = t.read().decode('utf-8', 'replace')
              print('VERIFY OK: chapter 1 of "%s" reads from the CDN '
                    '(%d chars)' % (book.get('title'), len(text)))
          elif (ch.get('content') or ''):
              print('chapter still inline (migration will catch it) - fine')
          else:
              print('no content and no url yet - will verify on rerun')
          VEREOF

      - name: Commit diagnostics on failure
        if: failure()
        run: |
          { echo "migration diag $(date -u +%FT%TZ)";
            tail -c 2000 /tmp/wake.log 2>/dev/null;
            tail -c 2500 /tmp/deploy.log 2>/dev/null;
            tail -c 2500 migrate.log 2>/dev/null; } > import-error.txt || true
          [ -s import-error.txt ] || echo "no log" > import-error.txt
          git config user.email "booknest-ci@users.noreply.github.com"
          git config user.name "booknest-ci"
          git checkout -q -B import-diag
          git add import-error.txt
          git commit -q -m "migration diag $(date -u +%FT%TZ)" || true
          git push -q -f origin import-diag || git push -f origin import-diag || true
