name: Library Import

# Fills the shelf with 1,500+ real public-domain classics — and runs
# itself end to end once the owner's two secrets exist (CHECKLIST
# steps 3): deploys the current server, mints a fresh IMPORT_TOKEN on
# the server (never printed, never stored), then streams Project
# Gutenberg's most-read English classics in batches with covers.
# Idempotent: unchanged books skip, so reruns are cheap and safe.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'How many books to import (1500–2500)'
        default: '1600'
      probe:
        description: 'Readiness check only — import nothing'
        default: 'false'
  # Self-starting: the first push that touches this file runs the whole
  # pipeline (deploy + import) with no clicks — and registers the
  # workflow so it shows up in the Actions sidebar from then on.
  push:
    branches:
      - arena/01a03a7f-booknest
    paths:
      - '.github/workflows/library-import.yml'

permissions:
  contents: write # pushes its own diagnostics when a step fails

env:
  FN_URL: https://ekgbbbbjwgfixqarlnil.supabase.co/functions/v1/booknest-api
  ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrZ2JiYmJqd2dmaXhxYXJsbmlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MDAzODEsImV4cCI6MjEwMzI3NjM4MX0.DTTcX2DOxME72qF0fJzcAPJAWPd64LmhYKtT2SOlRy0

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Readiness check (probe mode)
        if: ${{ github.event.inputs.probe == 'true' }}
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_REF: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
        run: |
          {
            echo "## Library Import readiness"
            echo ""
            echo "- SUPABASE_ACCESS_TOKEN set: **$HAS_TOKEN**"
            if [ "$HAS_TOKEN" = "true" ]; then
              echo ""
              echo "✅ Ready — run this workflow normally (Readiness check = false)."
              echo "It will deploy the server, mint the import key, and fill the shelf."
            else
              echo ""
              echo "❌ Not ready — add SUPABASE_ACCESS_TOKEN (CHECKLIST step 3), then re-run."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Guard — the owner's access token must exist
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            {
              echo "## Library Import needs SUPABASE_ACCESS_TOKEN"
              echo ""
              echo "Add it under Settings → Secrets and variables → Actions"
              echo "(CHECKLIST step 3), then run this workflow again. The"
              echo "project reference is built into the workflow."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Deploy the current server first
        if: ${{ github.event.inputs.probe != 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy booknest-api
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The project reference is public (it lives in the function URL);
          # only the access token is a real secret.
          SUPABASE_PROJECT_REF: ekgbbbbjwgfixqarlnil
        run: |
          set -o pipefail
          DEPLOY() {
            supabase functions deploy booknest-api \
              --project-ref "$SUPABASE_PROJECT_REF" "$@" 2>&1 | tee /tmp/deploy.log
          }
          # API bundling first; Docker bundling as fallback.
          if DEPLOY --use-api; then
            echo "Deployed (api bundling)."
          elif DEPLOY; then
            echo "Deployed (docker bundling)."
          else
            # Make the real error readable from outside CI.
            tail -c 2500 /tmp/deploy.log > deploy-error.txt || true
            git config user.email "booknest-ci@users.noreply.github.com"
            git config user.name "booknest-ci"
            git add deploy-error.txt
            git commit -q -m "Library Import: deploy diagnostics [skip ci]" || true
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
            echo "Deploy failed — see deploy-error.txt in the repo." >&2
            exit 1
          fi

      - name: Mint the import key on the server (never shown, never stored)
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ekgbbbbjwgfixqarlnil
        run: |
          TOKEN=$(openssl rand -hex 24)
          echo "::add-mask::$TOKEN"
          echo "IMPORT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          supabase secrets set IMPORT_TOKEN="$TOKEN" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preflight — the server must accept the fresh key
        if: ${{ github.event.inputs.probe != 'true' }}
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/pf.json -w '%{http_code}' --max-time 30 \
              -X POST "$FN_URL" \
              -H "Authorization: Bearer $ANON" \
              -H 'Content-Type: application/json' \
              -d "{\"action\":\"admin.importBooks\",\"importToken\":\"$IMPORT_TOKEN\",\"books\":[]}")
            if [ "$CODE" != "403" ] && [ "$CODE" != "401" ]; then
              echo "Import key accepted (HTTP $CODE)."
              exit 0
            fi
            echo "attempt $i: HTTP $CODE — waiting for the key to go live…"
            sleep 10
          done
          echo "The server never accepted the import key" >&2
          exit 1

      - name: Seed the library
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          IMPORT_TOKEN: ${{ env.IMPORT_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
        timeout-minutes: 280
        run: |
          import csv, hashlib, io, json, os, re, sys, time, urllib.request

          FN_URL = os.environ['FN_URL'].rstrip('/')
          TOKEN = os.environ['IMPORT_TOKEN']
          TARGET = max(1500, min(2500, int(os.environ.get('TARGET') or '1600')))

          # Hand-written one-liners for the most-read classics — keyed by
          # Gutenberg id. Everything else gets an honest generated line.
          CURATED = {
              '1342': 'A country family swirls into uproar when a wealthy, proud stranger and his even prouder friend move into the neighbourhood — the most beloved romance in the English language.',
              '84': 'A student of natural philosophy assembles life from death, then learns his creation wants an answer from him. The founding masterpiece of science fiction.',
              '11': 'A bored girl follows a waistcoated rabbit down a hole and into a world where tea is always hot, logic is upside down, and the Queen wants everyone headless.',
              '1661': 'The first twelve adventures of Sherlock Holmes and Dr. Watson — the stories that invented modern detective fiction.',
              '2097': 'The full casebook of the world\'s only consulting detective, gathered in one volume.',
              '2701': 'A whaling captain\'s one-legged hunt for the white whale that took his leg — a storm of obsession, humour and the sea.',
              '345': 'A young lawyer travels to Count Dracula\'s castle and unleashes an ancient hunger on modern Europe. The novel that defined the vampire.',
              '43': 'A respectable doctor drinks a formula that splits him in two — and one half enjoys it.',
              '174': 'A beautiful young man stays miraculously young while his portrait grows old and wicked in the attic.',
              '98': 'Two cities, one revolution, and a substitute at the guillotine — Dickens at his most soaring.',
              '1400': 'An orphan climbs from the marshes to London society on the strength of a mystery benefactor — Pip\'s rise and reckoning.',
              '46': 'A cold miser is visited by three spirits on Christmas Eve and given one last chance.',
              '76': 'A boy and a runaway raft drift down the Mississippi while the country\'s conscience travels with them.',
              '55': 'A farm girl, a scarecrow, a tin man and a lion follow the yellow road to the Emerald City.',
              '16': 'The boy who refused to grow up, and the window he always comes back to.',
              '120': 'An innkeeper\'s son finds a treasure map in a dead man\'s chest and sails with the most dangerous crew afloat.',
              '158': 'Emma Woodhouse is handsome, clever and rich — and never wrong, which gets everyone into trouble.',
              '161': 'Two sisters with very different temperaments navigate love, ruin and reputation.',
              '141': 'Fanny Price, sent away to live with rich relations, learns the price of saying no.',
              '1260': 'A plain, penniless governess with an unbreakable spine meets a house with a locked attic.',
              '768': 'On the wild Yorkshire moors, two families destroy each other with a love that outlives death.',
              '2600': 'Napoleon\'s era seen through Russian drawing rooms and battlefields — the widest novel ever written.',
              '996': 'A gentleman reads too many chivalric romances and decides the world needs him to fix it. The first modern novel.',
              '1184': 'Wronged and imprisoned, Edmond Dantès returns rich, unrecognisable, and very patient.',
              '135': 'Jean Valjean steals a loaf of bread and spends the rest of an epic lifetime earning his soul.',
              '219': 'A river journey into the Congo, and into what civilization pretends not to be.',
              '2591': 'The fairy tales collected by the Brothers Grimm — sharp, strange, and original recipe.',
              '1952': 'A woman rest-cured in a nursery bedroom documents her own unraveling — the classic of interior horror.',
              '2814': 'Fifteen portraits of Dublin life, each ending in a small, devastating epiphany.',
              '2542': 'A wife must choose between the shelter of her marriage and becoming a person — the door-slam heard round the world.',
              '1727': 'The ten-year homecoming of the man of twists and turns, told with wine-dark patience.',
              '6130': 'Rage of Achilles, war of kings — the fountainhead of Western literature.',
              '2148': 'The complete tales and poems of Edgar Allan Poe — ravens, tell-tale hearts and all.',
          }

          GENRE_MAP = [
              ('detective', 'Crime'), ('crime', 'Crime'), ('mystery', 'Crime'),
              ('science fiction', 'Science Fiction'), ('utopias', 'Science Fiction'),
              ('horror', 'Horror'), ('ghost', 'Horror'), ('gothic', 'Horror'),
              ('love', 'Romance'), ('romance', 'Romance'),
              ('poetry', 'Poetry'), ('poems', 'Poetry'),
              ('drama', 'Drama'), ('theater', 'Drama'), ('tragedy', 'Drama'),
              ('philosophy', 'Philosophy'), ('ethics', 'Philosophy'),
              ('history', 'History'), ('biography', 'History'),
              ('fairy', "Children's"), ('children', "Children's"),
              ('fantasy', 'Fantasy'), ('magic', 'Fantasy'),
              ('adventure', 'Adventure'), ('voyages', 'Adventure'),
              ('humor', 'Humor'), ('satire', 'Humor'),
          ]

          def genre_of(subjects):
              blob = ' '.join(subjects).lower()
              for key, genre in GENRE_MAP:
                  if key in blob:
                      return genre
              return 'Classics'

          def http_get(url, timeout=45, tries=3):
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'BookNest-library/1.0'})
                      with urllib.request.urlopen(req, timeout=timeout) as r:
                          return r.read()
                  except Exception:
                      if attempt == tries - 1:
                          return None
                      time.sleep(1.5 * (attempt + 1))
              return None

          print('Fetching the Project Gutenberg catalog…')
          raw = http_get('https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv.gz')
          if raw is None:
              raw = http_get('https://www.gutenberg.org/files/feeds/pg_catalog.csv.gz')
          if raw is None:
              print('Catalog unreachable — aborting.'); sys.exit(1)
          try:
              import gzip
              raw = gzip.decompress(raw)
          except Exception:
              pass
          rows = list(csv.DictReader(io.StringIO(raw.decode('utf-8', 'replace'))))
          pool = []
          for r in rows:
              try:
                  if (r.get('Copyright') or '').strip() not in ('Public domain in the USA.', ''):
                      continue
                  if (r.get('Language') or '').strip() != 'English':
                      continue
                  if not (r.get('Authors') or '').strip() or not (r.get('Title') or '').strip():
                      continue
                  if r.get('Type') and r['Type'] != 'Text':
                      continue
                  downloads = int(r.get('Download count') or 0)
                  if downloads < 20:
                      continue
                  subjects = [s for s in (r.get('Subjects') or '').split(';') if s.strip()]
                  author = re.sub(r'\s+', ' ', r['Authors']).split(' and ')[0].strip()
                  # Catalog order is "Last, First" — readers expect "First Last".
                  if ',' in author:
                      last, _, first = author.partition(',')
                      author = f'{first.strip()} {last.strip()}'.strip()
                  title = re.sub(r'\s+', ' ', r['Title']).strip()
                  # Drop catalog extras: "(illustrated)", "(with audio)", trailing bits.
                  title = re.sub(r'\s*\([^)]{0,60}\)', '', title).strip(' ;:,')
                  gid = r['Text #'].strip()
                  curated = CURATED.get(gid)
                  if curated:
                      description = curated
                  else:
                      description = (f'A beloved {genre_of(subjects).lower()} classic '
                                     f'by {author or "a classic author"}, among the '
                                     f'most-read public-domain books in the world — '
                                     f'presented here in full.')
                  pool.append({
                      'id': gid,
                      'title': title,
                      'author': author,
                      'downloads': downloads,
                      'genre': genre_of(subjects),
                      'description': description[:400],
                  })
              except Exception:
                  continue
          pool.sort(key=lambda b: -b['downloads'])
          picks = pool[:TARGET + 400]
          print(f'Catalog: {len(rows)} rows, eligible {len(pool)}, attempting {len(picks)}')

          HEAD = re.compile(r'\*\*\*\s*START OF (?:THE|THIS) PROJECT GUTENBERG[^\n]*\n', re.I)
          FOOT = re.compile(r'\*\*\*\s*END OF (?:THE|THIS) PROJECT GUTENBERG.*', re.I | re.S)
          CHAP = re.compile(r'^(?:(CHAPTER|Chapter|BOOK|Book|PART|Part|STAVE|Canto)\s+[\wIVXLC]+[.:\u2014\u2012-]?)\s*$|^(?:(?:CHAPTER|Chapter)\s+[A-Z][^\n]{0,60})$', re.M)

          def split_chapters(text):
              text = re.sub(r'\r\n', '\n', text)
              text = re.sub(r'\n{4,}', '\n\n\n', text)
              matches = list(CHAP.finditer(text))
              if len(matches) < 3:
                  return [{'chapterNumber': 1, 'title': 'Full text', 'content': text[:380000]}]
              chapters = []
              for i, m in enumerate(matches):
                  start = m.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
                  body = text[start:end].strip()
                  if len(body) < 40:
                      continue
                  chapters.append({
                      'chapterNumber': len(chapters) + 1,
                      'title': re.sub(r'\s+', ' ', m.group(0)).strip()[:100],
                      'content': body[:380000],
                  })
              if not chapters:
                  return [{'chapterNumber': 1, 'title': 'Full text', 'content': text[:380000]}]
              return chapters[:300]

          CLOUD = 'deqdmwlt7'
          PRESET = 'BookNest'

          def upload_cover(gid, slug):
              """Fetches Gutenberg's cover art and hosts it on BookNest's
              media library. Returns the hosted URL, or None."""
              img = http_get(
                  f'https://www.gutenberg.org/cache/epub/{gid}/pg{gid}.cover.medium.jpg')
              if img is None or len(img) < 900:
                  return None
              boundary = 'bn' + hashlib.md5(slug.encode()).hexdigest()[:16]
              parts = []
              for name, value in (
                      ('upload_preset', PRESET),
                      ('folder', 'booknest/covers'),
                      ('public_id', f'bulk-{slug}')):
                  parts.append(
                      f'--{boundary}\r\nContent-Disposition: form-data; '
                      f'name="{name}"\r\n\r\n{value}\r\n'.encode())
              parts.append(
                  f'--{boundary}\r\nContent-Disposition: form-data; '
                  f'name="file"; filename="{gid}.jpg"\r\n'
                  f'Content-Type: image/jpeg\r\n\r\n'.encode() + img + b'\r\n')
              parts.append(f'--{boundary}--\r\n'.encode())
              body = b''.join(parts)
              req = urllib.request.Request(
                  f'https://api.cloudinary.com/v1_1/{CLOUD}/image/upload',
                  data=body, method='POST',
                  headers={'Content-Type': f'multipart/form-data; boundary={boundary}',
                           'User-Agent': 'BookNest-library/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      out = json.loads(r.read().decode())
                  url = out.get('secure_url')
                  return url if isinstance(url, str) and url.startswith('https://') else None
              except Exception:
                  return None

          def post_batch(books):
              body = json.dumps({'action': 'admin.importBooks',
                                 'importToken': TOKEN, 'books': books}).encode()
              req = urllib.request.Request(
                  FN_URL, data=body, method='POST',
                  headers={'Content-Type': 'application/json',
                         'Authorization': 'Bearer ' + os.environ['ANON']})
              with urllib.request.urlopen(req, timeout=180) as r:
                  out = json.loads(r.read().decode())
              return out.get('data', out)

          batch, total_imported, total_skipped, fails = [], 0, 0, 0
          for b in picks:
              if total_imported >= TARGET:
                  break
              gid = b['id']
              data = http_get(f'https://www.gutenberg.org/cache/epub/{gid}/pg{gid}.txt')
              if data is None:
                  data = http_get(f'https://www.gutenberg.org/files/{gid}/{gid}-0.txt')
              if data is None:
                  fails += 1
                  continue
              text = data.decode('utf-8', 'replace')
              m = HEAD.search(text)
              if m:
                  text = text[m.end():]
              text = FOOT.sub('', text).strip()
              if len(text) < 8000:
                  fails += 1
                  continue
              chapters = split_chapters(text)
              slug = (b['title'] + '|' + b['author']).lower()
              slug = re.sub(r'[^a-z0-9|]+', '-', slug).strip('-')[:90]
              cover = upload_cover(gid, slug) if total_imported < 4000 else None
              if cover:
                  print(f'cover ok: {b["title"][:40]}')
              batch.append({
                  'title': b['title'][:200],
                  'author': b['author'][:120],
                  'genre': b['genre'],
                  'description': b['description'],
                  'coverUrl': cover,
                  'chapters': chapters,
              })
              size = sum(len(c['content']) for c in chapters)
              if len(batch) >= 10 or size > 2_500_000:
                  try:
                      res = post_batch(batch)
                      total_imported += int(res.get('imported') or 0)
                      total_skipped += int(res.get('skipped') or 0)
                      print(f'batch: +{res.get("imported")} (total {total_imported}, skipped {total_skipped})')
                  except Exception as e:
                      print(f'batch failed ({e}); retrying once…')
                      time.sleep(4)
                      try:
                          res = post_batch(batch)
                          total_imported += int(res.get('imported') or 0)
                          total_skipped += int(res.get('skipped') or 0)
                      except Exception as e2:
                          print(f'batch failed again ({e2}); continuing.')
                  batch = []
                  time.sleep(0.4)
          if batch:
              try:
                  res = post_batch(batch)
                  total_imported += int(res.get('imported') or 0)
                  total_skipped += int(res.get('skipped') or 0)
              except Exception:
                  pass
          line = f'DONE: imported {total_imported}, unchanged/skipped {total_skipped}, unfetchable {fails}'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'### Library Import\n{line}\n')
          PYEOF

      - name: Seed the dictionary (WordNet 3.1 — the full Word Nest)
        if: ${{ github.event.inputs.probe != 'true' }}
        env:
          IMPORT_TOKEN: ${{ env.IMPORT_TOKEN }}
        timeout-minutes: 90
        run: |
          set -e
          mkdir -p /tmp/wn && cd /tmp/wn
          npm i --silent wordnet-db >/dev/null 2>&1
          cat > parse.py << 'PARSEEOF'
          """WordNet 3.1 → BookNest dictionary entries.

          Reads the classic WordNet database files and emits one entry per
          (word, part-of-speech): merged senses, first example found, synonyms
          from shared synsets. Honest parsing — no scraping, no guessing.
          """
          import json, os, sys, re

          DICT = sys.argv[1] if len(sys.argv) > 1 else 'node_modules/wordnet-db/dict'
          OUT = sys.argv[2] if len(sys.argv) > 2 else '/tmp/wn/entries.jsonl'

          POS_NAME = {'noun': 'noun', 'verb': 'verb', 'adj': 'adjective', 'adv': 'adverb'}
          MAX_SENSES = 6
          MAX_SYN = 10
          MAX_DEF_CHARS = 1200

          def parse_index(pos):
              """lemma -> list of synset offsets."""
              out = {}
              with open(os.path.join(DICT, f'index.{pos}'), encoding='utf-8', errors='replace') as f:
                  for line in f:
                      if line.startswith(' '):
                          continue
                      fields = line.split()
                      if len(fields) < 9:
                          continue
                      lemma = fields[0].lower()
                      try:
                          synset_cnt = int(fields[2])
                          p_cnt = int(fields[3])
                      except ValueError:
                          continue
                      # layout: lemma pos cnt p_cnt [p_cnt pointers] sense_cnt tagsense_cnt offsets…
                      offsets_at = 4 + p_cnt + 2     # skip pointers, sense_cnt, tagsense_cnt
                      offsets = fields[offsets_at:offsets_at + synset_cnt]
                      try:
                          out[lemma] = [int(o) for o in offsets]
                      except ValueError:
                          continue
              return out

          LEX_TASK = re.compile(r'";\s*"(.+?)"')  # example sentences inside gloss

          def parse_data(pos):
              """offset -> (words, definition, example)."""
              out = {}
              with open(os.path.join(DICT, f'data.{pos}'), encoding='utf-8', errors='replace') as f:
                  for line in f:
                      if line.startswith('  '):
                          continue
                      try:
                          offset = int(line.split(' ', 1)[0])
                      except ValueError:
                          continue
                      bar = line.find('| ')
                      if bar < 0:
                          continue
                      head = line[:bar]
                      gloss = line[bar + 2:].strip()
                      fields = head.split()
                      try:
                          w_cnt = int(fields[3])
                      except ValueError:
                          continue
                      words = []
                      idx = 4
                      for _ in range(w_cnt):
                          words.append(fields[idx].replace('_', ' '))
                          idx += 2  # word + lex_id
                      example = ''
                      m = LEX_TASK.search(gloss)
                      if m:
                          example = m.group(1).strip()
                      definition = LEX_TASK.sub('', gloss).split(';')[0].strip().rstrip(';').strip()
                      out[offset] = (words, definition, example)
              return out

          def main():
              total_new, total_senses, entries = 0, 0, []
              for pos in ('noun', 'verb', 'adj', 'adv'):
                  index = parse_index(pos)
                  data = parse_data(pos)
                  print(f'{pos}: {len(index)} lemmas, {len(data)} synsets', flush=True)
                  for lemma, offsets in index.items():
                      senses, syns, example = [], [], ''
                      for off in offsets:
                          rec = data.get(off)
                          if not rec:
                              continue
                          words, definition, ex = rec
                          if definition and definition not in senses:
                              senses.append(definition)
                              total_senses += 1
                          for w in words:
                              if w.lower() != lemma and w not in syns:
                                  syns.append(w)
                          if not example and ex:
                              example = ex
                          if len(senses) >= MAX_SENSES:
                              break
                      if not senses:
                          continue
                      definition = ' '.join(f'{i+1}. {d}' for i, d in enumerate(senses))
                      if len(definition) > MAX_DEF_CHARS:
                          definition = definition[:MAX_DEF_CHARS - 3].rstrip() + '…'
                      entries.append({'w': lemma.replace('_', ' '), 'p': POS_NAME[pos],
                                      'd': definition, 'e': example[:300],
                                      's': syns[:MAX_SYN]})
                      total_new += 1
              entries.sort(key=lambda e: e['w'])
              with open(OUT, 'w', encoding='utf-8') as f:
                  for e in entries:
                      f.write(json.dumps(e, ensure_ascii=False) + '\n')
              words = len({e['w'] for e in entries})
              print(f'ENTRIES: {total_new} ({words} distinct words, {total_senses} senses)')

          if __name__ == '__main__':
              main()

          PARSEEOF
          python3 parse.py "$PWD/node_modules/wordnet-db/dict" entries.jsonl
          python3 - << 'POSEOF'
          import json, os, time, urllib.request

          FN_URL = os.environ['FN_URL'].rstrip('/')
          ANON = os.environ['ANON']
          TOKEN = os.environ['IMPORT_TOKEN']

          entries = [json.loads(l) for l in open('entries.jsonl', encoding='utf-8')]
          print(f'Dictionary entries parsed: {len(entries)}')

          def post(words):
              body = json.dumps({{'action': 'dictionary.import',
                                  'importToken': TOKEN, 'words': words}}).encode()
              req = urllib.request.Request(
                  FN_URL, data=body, method='POST',
                  headers={{'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + ANON}})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return json.loads(r.read().decode()).get('data', {{}})

          total, done = 0, 0
          for i in range(0, len(entries), 200):
              chunk = entries[i:i + 200]
              try:
                  res = post(chunk)
                  total += int(res.get('imported') or 0)
              except Exception as e:
                  print(f'batch failed ({{e}}); retrying once…')
                  time.sleep(4)
                  try:
                      res = post(chunk)
                      total += int(res.get('imported') or 0)
                  except Exception as e2:
                      print(f'batch failed again ({{e2}}); continuing.')
              done += len(chunk)
              if done % 5000 < 200:
                  print(f'  {{done}}/{{len(entries)}} words…', flush=True)
          time.sleep(1)
          try:
              body = json.dumps({{'action': 'dictionary.search', 'q': 'serendipity'}}).encode()
              req = urllib.request.Request(
                  FN_URL, data=body, method='POST',
                  headers={{'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + ANON}})
              with urllib.request.urlopen(req, timeout=30) as r:
                  found = len(json.loads(r.read().decode()).get('data', {{}}).get('entries') or [])
              print(f'server lookup check: {{found}} result(s) for "serendipity"')
          except Exception as e:
              print(f'lookup check skipped ({{e}})')
          line = f'DONE: dictionary entries stored {{total}} of {{len(entries)}}'
          print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f'### Word Nest\n{{line}}\n')
          POSEOF
